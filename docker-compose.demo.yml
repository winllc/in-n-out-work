# A demo of the whole application from one command, with nothing to configure and nothing to
# sign in with.
#
#     docker compose -f docker-compose.demo.yml -p readyroom-demo up --build
#
# Visitors sign in, and the login page lists the seeded accounts to sign in as - one per role. Nothing
# in it can be changed, whichever role is chosen.
#
# Nothing is published to the host. The application listens on 8181 inside the demo network only,
# because the demo publishes working credentials, and binding that to the host by default would put
# everything those accounts can see within reach of the machine. Reach it on purpose instead,
# either by putting something in front of it on this network, or with an override file:
#
#     # demo-ports.yml
#     services:
#       app:
#         ports: ["8181:8181"]
#
#     docker compose -f docker-compose.demo.yml -f demo-ports.yml -p readyroom-demo up --build
#
# What comes up:
#   postgres, openldap   the backing services
#   app                  built from source, running with the demo profile
#   demo-seed-ldap       loads the mock users and groups into the directory, then exits
#   demo-seed-db         loads the check-in/out history and the manager role once the tables exist
#
# The seeders wait for what they need - the directory for one, the application's tables for the
# other, since Hibernate creates those on first start - so one "up" is genuinely enough and there
# is no second command to remember. Both verify what they loaded and exit non-zero if it is not
# there.
#
# Use -p as above. Without it, compose derives the project from the directory name and this stack
# would share its network and volumes with docker-compose.yml.
#
# If the application comes up with no data in it, the seeder is what to look at - it verifies its
# own work and exits non-zero with the reason, which a plain "up" does not make obvious because the
# other services keep running:
#
#     docker compose -f docker-compose.demo.yml -p readyroom-demo logs demo-seed-ldap demo-seed-db
#
# THIS IS NOT A PRODUCTION CONFIGURATION. The credentials are published on the login page, so
# everything those accounts can see is readable by anyone who can reach the port. The data is the
# mock fixture from test/seed-mock-data.sh and nothing else belongs in it.

services:
  postgres:
    image: postgres:16
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: appdb
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - demo

  openldap:
    image: osixia/openldap:1.5.0
    container_name: demo-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "WINLLC"
      LDAP_DOMAIN: "winllc.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonlypass"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
      LDAP_ENABLE_PPOLICY: "true"
    volumes:
      - demo_openldap_data:/var/lib/ldap
      - demo_openldap_config:/etc/ldap/slapd.d
      - ./test/openldap/enable-pagination.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/enable-pagination.ldif
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=winllc,dc=com -s base -D cn=admin,dc=winllc,dc=com -w adminpassword >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - demo

  app:
    build:
      context: .
      dockerfile: test/Dockerfile
    container_name: demo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    environment:
      # Read-only, no sign-in, presented as the seeded Demo Admin. See application-demo.yml.
      SPRING_PROFILES_ACTIVE: demo
      # The packaged defaults already name the postgres and openldap services, so there is
      # nothing to override here and no mounted config file.
      JAVA_OPTS: ""
    # No port published to the host. Demo mode has no authentication, so binding it to the host by
    # default would put an unauthenticated copy of the application on the machine's interfaces for
    # anything that can reach them. It listens on 8181 inside the demo network, which is where
    # something in front of it - or a deliberate override, see the header - reaches it.
    expose:
      - "8181"
    networks:
      - demo

  # Two seeders rather than one, because the image that already ships ldapadd and the image that
  # already ships psql are different ones. Both are built from test/Dockerfile.seed, which only adds
  # the script to a base the stack already pulls - nothing is installed, so nothing has to be
  # reachable at build time. The halves are independent: the user list is fixed and the records
  # derive from it alone.
  demo-seed-ldap:
    build:
      context: .
      dockerfile: test/Dockerfile.seed
      args:
        BASE_IMAGE: osixia/openldap:1.5.0
    container_name: demo-seed-ldap
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      SEED_TRANSPORT: network
      SEED_ONLY: ldap
      LDAP_HOST: openldap
      LDAP_PORT: "389"
      LDAP_BASE_DN: dc=winllc,dc=com
      LDAP_ADMIN_PW: adminpassword
    restart: "no"
    networks:
      - demo

  demo-seed-db:
    build:
      context: .
      dockerfile: test/Dockerfile.seed
      args:
        BASE_IMAGE: postgres:16
    container_name: demo-seed-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SEED_TRANSPORT: network
      SEED_ONLY: db
      PG_HOST: postgres
      PG_USER: appuser
      PG_PASSWORD: secret123
      PG_DB: appdb
    # Waits for the application to create its tables before inserting - Hibernate does that on
    # first start, so there is nowhere to put the records until then.
    restart: "no"
    networks:
      - demo

networks:
  demo:
    driver: bridge

volumes:
  demo_postgres_data:
  demo_openldap_data:
  demo_openldap_config:
