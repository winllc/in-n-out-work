# External Spring Boot config used when running the app via the root docker-compose.yml.
# It is mounted into the container at /app/config/application.yml and picked up through
# SPRING_CONFIG_ADDITIONAL_LOCATION, so its values override the packaged application.yml.
#
# It no longer has to name the datasource and directory hosts - the packaged defaults already
# name the compose services - but it still repeats them, harmlessly and identically. What it is
# actually for is the settings the seeded mock data needs: the super-user DNs, the attribute
# mappings the fixture uses, and the short cron intervals that make the jobs observable.
# No server block: the packaged defaults are already plain HTTP on 8181. Repeating them here
# would also break the switch back, since a literal value in this file beats the SSL_ENABLED
# placeholder in the packaged file - set SSL_ENABLED and SERVER_PORT in the compose
# environment instead, and publish the port you choose.

logging:
  level:
    root: info

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/appdb
    username: appuser
    password: secret123
    driver-class-name: org.postgresql.Driver
  jpa:
    # Off: otherwise a web request holds its database connection until it finishes, including while it
    # waits on LDAP, and a slow directory can exhaust the connection pool.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ldap://openldap:389
    username: cn=admin,dc=winllc,dc=com
    password: adminpassword
    # Timeouts in milliseconds; without them an unresponsive directory holds requests indefinitely.
    # Pooling is on by default (application.ldap.pooled); see LdapConnectionConfig.
    base-environment:
      "[com.sun.jndi.ldap.connect.timeout]": 5000
      "[com.sun.jndi.ldap.read.timeout]": 30000
  task:
    scheduling:
      # One thread per scheduled job, so a slow run of one does not delay the others.
      pool:
        size: 3
  jackson:
    time-zone: America/New_York
    date-format: yyyy-MM-dd HH:mm a z
  mail:
    host: mailcow.winllc-dev.com
    port: 587
    username: user1@winllc-dev.com
    password: password
    properties:
      mail:
        smtp:
          ssl:
            trust: "*"
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

application:
  user-base-dn: dc=winllc,dc=com
  user-ldap-filter: (objectclass=inetOrgPerson)

  banner-text: BANNER TEXT
  timezone: America/New_York
  user-ldap-employee-type-attribute: employeeType
  user-ldap-organization-attribute: o
  user-ldap-location-attribute: l
  super-user-dns:
    - CN=user3,OU=Users,DC=winllc,DC=com
    # Mock super-user so admin features are testable with the seeded data (alice / password)
    - CN=Alice Adams,OU=Users,DC=winllc,DC=com
    # The account demo mode is presented as; seeded by test/seed-mock-data.sh. Demo mode grants
    # every role anyway, so this is what makes it an administrator when signed in normally too
    # (demo / password).
    - CN=Demo Admin,OU=Users,DC=winllc,DC=com
  groups:
    - groups-base-dn: ou=Groups,dc=winllc,dc=com
    - groups-base-dn: ou=Companies,dc=winllc,dc=com
  update-profile-url: https://google.com
  checkOutAfterMinutes: 2
  inactive-cron:
    fixed-rate: 60000
    initial-delay: 60000
  send-absent-notification-cron:
    fixed-rate: 300000
    initial-delay: 1
  notification-sender-email: user1@winllc-dev.com
  user-ldap-manager-id-attribute: title
  manager-ldap-id-attribute: street
  application-base-url: http://localhost:8181
  duty-sub-org-groups-base-dn: ou=Groups,dc=winllc,dc=com
  user-ldap-duty-sub-organization-attribute: departmentNumber
  windows-auth:
    # Windows (Kerberos) sign-in for the Windows client's check-in, lock and unlock calls, alongside client
    # certificates. Off: nothing about sign-in changes. See the README before turning it on.
    enabled: false
    # service-principal: HTTP/inout.winllc.com@WINLLC.COM
    # keytab-location: /etc/in-n-out/http.keytab
    # Directory attribute holding the Windows account name. Active Directory: sAMAccountName (default), or
    # userPrincipalName with strip-realm: false.
    account-attribute: uid
    strip-realm: true
