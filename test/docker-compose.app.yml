# Full stack that also BUILDS and RUNS the application (in addition to the
# backing services). Use this instead of docker-compose.yml when you want the
# app itself running in a container:
#
#     cd test
#     docker compose -f docker-compose.app.yml up --build
#
# The app is built from source via test/Dockerfile (multi-stage) and connects to
# the postgres/openldap services by their container network names.
#
# Note: this brings up its own postgres + openldap using the same container
# names as docker-compose.yml, so don't run both compose files at the same time.

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "WINLLC"
      LDAP_DOMAIN: "winllc.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonlypass"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
      LDAP_ENABLE_PPOLICY: "true"
    ports:
      - "1389:389"
      - "1636:636"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./openldap/enable-pagination.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/enable-pagination.ldif
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=winllc,dc=com -s base -D cn=admin,dc=winllc,dc=com -w adminpassword >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  app:
    build:
      context: ..
      dockerfile: test/Dockerfile
    container_name: innout-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    environment:
      # Use the mounted test/application.yml as the config source. Additional-location
      # takes precedence over the application.yml packaged in the jar.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
    volumes:
      - ./application.yml:/app/config/application.yml:ro
    ports:
      - "8444:8444"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  openldap_data:
  openldap_config:
