plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.winllc.innoutwork'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Lombok (compile-time annotation processor) ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // --- Core Web + REST ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Versions from Spring Security's BOM, through Boot's, so they always match spring-security-core.
    implementation 'org.springframework.security:spring-security-ldap'
    // Windows (Kerberos) sign-in for the check-in calls; off unless application.windows-auth.enabled.
    implementation 'org.springframework.security:spring-security-kerberos-core'

    // --- LDAP Client ---
    implementation 'org.springframework.boot:spring-boot-starter-data-ldap'

    // --- Database (PostgreSQL + JPA) ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    // Schema migrations (src/main/resources/db/migration, see db/README.md), run at startup.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // --- Actuator for monitoring ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation("org.apache.commons:commons-lang3:3.20.0")

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // In-memory directory so LDAP mapping is tested against a real server, not mocked assumptions.
    testImplementation 'com.unboundid:unboundid-ldapsdk'
    // Repository queries run against an in-memory database, since JPQL mistakes only surface at startup.
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testRuntimeOnly 'com.h2database:h2'
    // The Flyway migrations and the PostgreSQL-only behaviour run against real PostgreSQL in Docker (skipped when
    // Docker is unavailable).
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // An in-process Kerberos server, so Windows sign-in is tested with real tickets and a real keytab.
    testImplementation 'org.apache.kerby:kerb-simplekdc:2.1.2'
    testImplementation platform('org.junit:junit-bom:6.1.0-M1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// META-INF/build-info.properties: its build time is the release date a perpetual ENS license's
// maintenance is measured against (license.LicenseManagerConfig).
springBoot {
    buildInfo()
}

test {
    useJUnitPlatform()
}