name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The runner has Docker, so the Testcontainers Postgres tests run here too.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/reports/tests/test

      # The public API's OpenAPI 3 document, generated from the controllers by OpenApiDocumentTest (which also
      # fails the build when docs/api/readyroom-api-v1.json is out of date).
      - name: Keep the OpenAPI document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: build/openapi/
          if-no-files-found: error

  helm:
    # The Helm chart (deploy/helm/readyroom): lint and schema-check it with every example values file.
    runs-on: ubuntu-latest

    env:
      CHART: deploy/helm/readyroom
      KUBECONFORM_VERSION: v0.6.7
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint $values"
            helm lint --strict "$CHART" -f "$values"
            echo "::endgroup::"
          done

      - name: Render and validate against the Kubernetes 1.29 schemas
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm template $values"
            # The OpenShift Route and the Prometheus Operator's ServiceMonitor have no upstream schema; only
            # those two examples render them.
            extra=()
            case "$values" in *openshift*|*servicemonitor*) extra=(-ignore-missing-schemas) ;; esac
            helm template readyroom "$CHART" -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 "${extra[@]}"
            echo "::endgroup::"
          done

      - name: TLS without a truststore does not render
        run: |
          # The image has no truststore, and client certificates must never fall back to a default one.
          if helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" \
              --set tls.enabled=true --set tls.keystore.secretName=readyroom-tls > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "rendered with tls.enabled and no truststore"
            exit 1
          fi
          grep -q "tls.truststore.secretName is required" "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }

      - name: Certificates from a header without the proxy secret or a CA do not render
        run: |
          # Header mode trusts the certificate a proxy forwards only with the shared secret, and checks it
          # against the users' CAs; without either it would be anyone's to claim.
          if helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" \
              --set x509.source=header > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "rendered x509.source=header without a proxy secret"
            exit 1
          fi
          grep -q "x509.source header needs x509.proxySecret" "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
          if helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" --set x509.source=header \
              --set x509.proxySecret.value=0123456789abcdef0123456789abcdef > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "rendered x509.source=header without a CA"
            exit 1
          fi
          grep -q "x509.source header needs x509.trustedCa" "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }

      - name: Webhooks without a key do not render
        run: |
          # The key that encrypts webhook signing secrets is never generated at render time (it would change at
          # every helm template or Argo CD sync), so it must be given.
          if helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" \
              --set webhooks.enabled=true > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "rendered webhooks.enabled without webhooks.secretKey"
            exit 1
          fi
          grep -q "webhooks.enabled needs webhooks.secretKey" "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }

      - name: Several replicas on a ReadWriteOnce license volume do not render
        run: |
          # Two pods cannot share it; the license state is in the database, so the volume is turned off instead.
          if helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" \
              --set replicaCount=2 > /dev/null 2> "$RUNNER_TEMP/err"; then
            echo "rendered replicaCount=2 with a ReadWriteOnce license volume"
            exit 1
          fi
          grep -q "replicaCount > 1 with persistence.license" "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
          helm template readyroom "$CHART" -f "$CHART/ci/ha-values.yaml" | grep -q "kind: PodDisruptionBudget"
          # The license claim survives leaving the release and is never pruned: it may hold the installation id.
          helm template readyroom "$CHART" -f "$CHART/ci/default-values.yaml" > "$RUNNER_TEMP/default.yaml"
          grep -q "helm.sh/resource-policy: keep" "$RUNNER_TEMP/default.yaml"
          grep -q "argocd.argoproj.io/sync-options: Prune=false" "$RUNNER_TEMP/default.yaml"
          # Without the volume, ReadyRoom must never make up an installation id.
          helm template readyroom "$CHART" -f "$CHART/ci/ha-values.yaml" | grep -A1 "ENS_LICENSE_EXPECT_INSTALLATION_ID" | grep -q '"true"'

  accessibility:
    # axe-core (WCAG 2.0 and 2.1, A and AA rules) through Playwright against ReadyRoom's main pages, at desktop and
    # 320-pixel widths, signed in as an administrator, a manager and a user: a serious or critical violation fails
    # the job. The application runs from the test classpath with seeded data (./gradlew a11yServer: an in-memory
    # directory and database and the test license key). Every finding is kept as an artifact for the conformance
    # report (docs/accessibility/).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start ReadyRoom with seeded data
        run: |
          ./gradlew a11yServer --no-daemon > "$RUNNER_TEMP/a11y-server.log" 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "A11Y SERVER READY" "$RUNNER_TEMP/a11y-server.log"; then exit 0; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/a11y-server.log"
          exit 1

      # The runner's Node; the packages are pinned in a11y/package-lock.json.
      - name: Install Playwright and axe-core
        working-directory: a11y
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check the pages
        working-directory: a11y
        run: npx playwright test

      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility
          path: |
            a11y/results/
            a11y/test-results/
            ${{ runner.temp }}/a11y-server.log
          if-no-files-found: warn

  windows-client:
    # The Windows client (powershell/): PSScriptAnalyzer and the Pester tests, with Pester and PSScriptAnalyzer
    # pinned by version and SHA-256 in Invoke-ClientChecks.ps1. Linux runs everything that does not need Windows;
    # Windows runs it all, real ACLs, SIDs and junctions included, under Windows PowerShell 5.1 (what the
    # scheduled tasks run) and PowerShell 7.
    name: windows-client (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh

    defaults:
      run:
        # A step's own shell cannot read the matrix; the job's default can.
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze and test
        run: >-
          ./powershell/tests/Invoke-ClientChecks.ps1
          -ModulePath (Join-Path $env:RUNNER_TEMP 'psmodules')
          -TestResultPath (Join-Path $env:RUNNER_TEMP 'pester.xml')

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-${{ matrix.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/pester.xml

  image:
    # Builds the image on every push, checks it starts, and publishes what it just checked.
    # Nothing is published from a pull request: a fork's token cannot write packages, and
    # unreviewed code is not for the registry.
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
      # Keyless signing of the release image and chart (cosign, GitHub OIDC); used on release tags only.
      id-token: write

    env:
      # The customer release bundle (see "Releases" in the README). Secrets cannot be tested in a
      # step's if:, so whether they are configured is mapped to plain values here.
      PRODUCT_ID: readyroom
      RELEASE_IMAGE: ghcr.io/winllc/in-n-out-work
      RELEASE_OUT: dist/release
      HAS_GPG: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
      # The image scan, pinned by version and checksum.
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: readyroom:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers its liveness probe
        run: |
          # A throwaway Postgres for the schema; no directory or mail server. Liveness leaves
          # those out, so what is checked is that the image is assembled correctly and the
          # application inside it comes up. There is no license either, so the sign-in page must
          # still answer: it is how an administrator gets to the license screen.
          docker network create readyroom
          docker run -d --name postgres --network readyroom \
            -e POSTGRES_USER=appuser -e POSTGRES_PASSWORD=secret123 -e POSTGRES_DB=appdb postgres:16
          for i in $(seq 1 30); do docker exec postgres pg_isready -U appuser -d appdb && break; sleep 1; done
          docker run -d --name readyroom --network readyroom -p 8181:8181 \
            -e DB_HOST=postgres -e DB_USERNAME=appuser -e DB_PASSWORD=secret123 -e DB_NAME=appdb \
            -e MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true \
            readyroom:ci
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8181/actuator/health/liveness > /dev/null 2>&1; then
              echo "started after ${i}s"
              curl -fsS http://localhost:8181/actuator/health/liveness
              curl -fsS -o /dev/null http://localhost:8181/login
              exit 0
            fi
            sleep 1
          done
          echo "did not start"
          docker logs readyroom
          exit 1

      - name: Scan the image for known vulnerabilities
        run: |
          # Fails on any HIGH or CRITICAL vulnerability that has a fix, in the OS packages or the
          # application's libraries, so nothing with one is published. Accepted risks are listed, each with
          # its reason and a review date, in .trivyignore.
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore --no-progress --skip-version-check readyroom:ci

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Tag and push the image that was just started and scanned rather than building it again:
          # what is published has to be what was tested.
          for tag in $TAGS; do
            echo "pushing $tag"
            docker tag readyroom:ci "$tag"
            docker push "$tag"
          done
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- Customer release bundle -----------------------------------------------------------------
      # From the image checked above, never a second build. A v* tag makes a release; a pull request
      # makes a dry run (0.0.0-pr<n>) that is kept as a workflow artifact only, so every PR proves the
      # bundle still builds. Other pushes skip it.
      - name: Decide the release version
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) version="${GITHUB_REF_NAME#v}"; release=true ;;
            pull_request:*)    version="0.0.0-pr${PR_NUMBER}"; release=false ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT"; echo "No release bundle for this event."; exit 0 ;;
          esac
          {
            echo "build=true"
            echo "version=$version"
            echo "release=$release"
            echo "image=$RELEASE_IMAGE:$version"
          } >> "$GITHUB_OUTPUT"
          echo "Release bundle $PRODUCT_ID $version (release=$release)"

      - name: Tag the checked image with the release version
        if: steps.version.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker tag readyroom:ci "$IMAGE"
          mkdir -p "$RELEASE_OUT"

      - name: SBOM for the ReadyRoom image
        if: steps.version.outputs.build == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.version.outputs.image }}
          format: spdx-json
          output-file: ${{ env.RELEASE_OUT }}/sbom-in-n-out-work.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM for the PostgreSQL image
        if: steps.version.outputs.build == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: postgres:16
          format: spdx-json
          output-file: ${{ env.RELEASE_OUT }}/sbom-postgres.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Set up Helm
        if: steps.version.outputs.build == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      # The Helm chart, versioned like the release. It goes into the release output (so SHA256SUMS,
      # the signature, the bucket and the workflow artifact cover it) as readyroom-helm-<version>.tgz,
      # and on a release tag to oci://ghcr.io/winllc/charts/readyroom. Pull request dry runs package it
      # as 0.0.0-pr<n> and never push it.
      - name: Package the Helm chart
        id: chart
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package deploy/helm/readyroom --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
          cp "$RUNNER_TEMP/chart/readyroom-$VERSION.tgz" "$RELEASE_OUT/$PRODUCT_ID-helm-$VERSION.tgz"
          echo "tgz=$RUNNER_TEMP/chart/readyroom-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Publish the Helm chart
        id: chart-push
        if: steps.version.outputs.build == 'true' && steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TGZ: ${{ steps.chart.outputs.tgz }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$TGZ" oci://ghcr.io/winllc/charts 2>&1 | tee "$RUNNER_TEMP/helm-push.txt"
          helm registry logout ghcr.io
          digest="$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/helm-push.txt")"
          [ -n "$digest" ] || { echo "helm push printed no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signatures (Sigstore, this workflow's GitHub OIDC identity) of what was just published, by
      # digest, and an SPDX SBOM attestation of the image. Verify with:
      #   cosign verify ghcr.io/winllc/in-n-out-work@<digest> \
      #     --certificate-identity-regexp 'https://github.com/winllc/in-n-out-work/.github/workflows/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Set up cosign
        if: steps.version.outputs.build == 'true' && steps.version.outputs.release == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image and the chart, and attest the image's SBOM
        if: steps.version.outputs.build == 'true' && steps.version.outputs.release == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          CHART_DIGEST: ${{ steps.chart-push.outputs.digest }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$digest" ] || { echo "no digest for $IMAGE"; exit 1; }
          ref="$RELEASE_IMAGE@$digest"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "$RELEASE_OUT/sbom-in-n-out-work.spdx.json" "$ref"
          cosign sign --yes "ghcr.io/winllc/charts/readyroom@$CHART_DIGEST"
          {
            echo "### Signed (cosign, keyless)"
            echo
            echo "- \`$ref\` (signature and SPDX SBOM attestation)"
            echo "- \`ghcr.io/winllc/charts/readyroom@$CHART_DIGEST\` (signature)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the release bundle
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: OUT_DIR="$RELEASE_OUT" scripts/release-bundle.sh "$VERSION" "$IMAGE"

      - name: Sign the checksums
        id: sign
        if: steps.version.outputs.build == 'true' && env.HAS_GPG == 'true'
        shell: bash
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          # A keyring outside the workspace, removed afterwards; the key only ever goes to gpg.
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")"
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_KEY" | gpg --batch --quiet --import
          cd "$RELEASE_OUT"
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          else
            gpg --batch --pinentry-mode loopback --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          fi
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS

      - name: Upload the release to the bucket
        id: upload
        if: >-
          steps.version.outputs.build == 'true' && steps.version.outputs.release == 'true' &&
          env.S3_BUCKET != '' && env.HAS_AWS == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RELEASE_S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
        run: |
          args=()
          if [ -n "$S3_ENDPOINT" ]; then args+=(--endpoint-url "$S3_ENDPOINT"); fi
          dest="s3://$S3_BUCKET/$PRODUCT_ID/$VERSION"
          for f in "$RELEASE_OUT"/*; do
            aws "${args[@]}" s3 cp --only-show-errors "$f" "$dest/$(basename "$f")"
          done
          # latest.txt names the newest final release; pre-releases (1.2.0-rc.1) leave it alone.
          case "$VERSION" in
            *-*) echo "Pre-release: latest.txt not updated." ;;
            *) printf '%s\n' "$VERSION" | aws "${args[@]}" s3 cp --only-show-errors - "s3://$S3_BUCKET/$PRODUCT_ID/latest.txt" ;;
          esac

      - name: Keep the bundle as a workflow artifact
        if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.PRODUCT_ID }}-${{ steps.version.outputs.version }}
          path: ${{ env.RELEASE_OUT }}/
          retention-days: ${{ steps.version.outputs.release == 'true' && 30 || 3 }}
          # The tarball and image archive inside it are already compressed.
          compression-level: 0
          if-no-files-found: error

      - name: Summarise the release bundle
        if: always() && steps.version.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE: ${{ steps.version.outputs.release }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            echo "### Release bundle: $PRODUCT_ID $VERSION"
            echo
            if [ "$RELEASE" = true ]; then echo "Release (tag $GITHUB_REF_NAME)."; else echo "Dry run for a pull request: kept as a workflow artifact only."; fi
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in "$RELEASE_OUT"/*; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            case "$SIGN_OUTCOME" in
              success) echo "**Signed:** yes, \`SHA256SUMS.asc\`." ;;
              skipped) echo "**Signed:** no. \`RELEASE_GPG_PRIVATE_KEY\` is not configured." ;;
              *)       echo "**Signed:** no. The signing step ended with: $SIGN_OUTCOME." ;;
            esac
            echo
            if [ "$UPLOAD_OUTCOME" = success ]; then
              echo "**Uploaded:** \`s3://$S3_BUCKET/$PRODUCT_ID/$VERSION/\`."
            elif [ "$UPLOAD_OUTCOME" != skipped ]; then
              echo "**Uploaded:** no. The upload step ended with: $UPLOAD_OUTCOME."
            elif [ "$RELEASE" != true ]; then
              echo "**Uploaded:** no. Pull request dry runs are never uploaded."
            elif [ -z "$S3_BUCKET" ]; then
              echo "**Uploaded:** no. The \`RELEASE_S3_BUCKET\` variable is not set."
            elif [ "$HAS_AWS" != true ]; then
              echo "**Uploaded:** no. \`AWS_ACCESS_KEY_ID\` is not configured."
            else
              echo "**Uploaded:** no. An earlier step failed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
