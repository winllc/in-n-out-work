name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner has Docker, so the Testcontainers Postgres tests run here too.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

  image:
    # Builds the image on every push, checks it starts, and publishes what it just checked.
    # Nothing is published from a pull request: a fork's token cannot write packages, and
    # unreviewed code is not for the registry.
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: readyroom:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers its liveness probe
        run: |
          # A throwaway Postgres for the schema; no directory or mail server. Liveness leaves
          # those out, so what is checked is that the image is assembled correctly and the
          # application inside it comes up.
          docker network create readyroom
          docker run -d --name postgres --network readyroom \
            -e POSTGRES_USER=appuser -e POSTGRES_PASSWORD=secret123 -e POSTGRES_DB=appdb postgres:16
          for i in $(seq 1 30); do docker exec postgres pg_isready -U appuser -d appdb && break; sleep 1; done
          docker run -d --name readyroom --network readyroom -p 8181:8181 \
            -e DB_HOST=postgres -e DB_USERNAME=appuser -e DB_PASSWORD=secret123 -e DB_NAME=appdb \
            -e MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true \
            readyroom:ci
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8181/actuator/health/liveness > /dev/null 2>&1; then
              echo "started after ${i}s"
              curl -fsS http://localhost:8181/actuator/health/liveness
              exit 0
            fi
            sleep 1
          done
          echo "did not start"
          docker logs readyroom
          exit 1

      - name: Sign in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Tag and push the image that was just started rather than building it again: the
          # base images are floating tags, and what is published has to be what was tested.
          for tag in $TAGS; do
            echo "pushing $tag"
            docker tag readyroom:ci "$tag"
            docker push "$tag"
          done
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
