# Weekly dependency updates, minor and patch versions grouped into one pull request per ecosystem (major
# versions come one by one). Docker base images are pinned by digest; Dependabot proposes new digests and
# tags. GitHub Actions are pinned by commit SHA with the version in a comment, which Dependabot keeps up to
# date. The version overrides in build.gradle (ext['tomcat.version'] and the like) are security fixes ahead
# of Spring Boot: drop them when Dependabot brings a Boot release that includes them.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /test
      - /product-site
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The JDK that builds the jar stays on the Java release the application targets and runs on (21, the
      # runtime image's): a newer JDK compiles against a newer class library, and a non-LTS one soon stops
      # getting updates. Digest updates of 21-jdk still come through. A move to a newer Java changes it by hand
      # together with the runtime image (ubi9/openjdk-21-runtime), build.gradle and setup-java in CI.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
