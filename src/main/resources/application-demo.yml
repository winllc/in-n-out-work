# The demo profile: read-only, with the seeded accounts published on the login page.
#
#     ./gradlew bootRun --args='--spring.profiles.active=demo'
#
# Visitors still sign in. This profile does not change who can do what - the directory and
# super-user-dns decide that as always - it turns off writing and lists a few accounts so someone
# with no account of their own can pick a role and look around as it.
#
# The accounts below are the ones test/seed-mock-data.sh creates, and the roles are what those
# accounts genuinely hold in the seeded data:
#   demo    listed under super-user-dns in application.yml, so ADMIN
#   alice   given user_role MANAGER by the seed script, and the directory manager of everyone else
#   bob     nothing special, so a plain USER
#
# Publishing credentials makes everything those accounts can see readable by anyone who can reach
# the login page. Only ever point this at seeded demo data. See the Demo mode section of the README.
application:
  demo:
    enabled: true
    banner: "DEMO - read only"
    accounts:
      - role: "Administrator"
        username: "demo"
        password: "password"
        description: "Everything: all groups, settings, reports and the org chart"
      - role: "Manager"
        username: "alice"
        password: "password"
        description: "Her own day, her direct reports, and the groups she manages"
      - role: "User"
        username: "bob"
        password: "password"
        description: "His own attendance and profile only"
