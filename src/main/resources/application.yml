server:
  port: ${SERVER_PORT:8181}
  ssl:
    # Off by default so the application starts and is reachable over plain HTTP with no
    # certificate setup.
    #
    # Note what is off with it. Client-certificate (X.509) sign-in needs TLS, so with this
    # false the only way in is the LDAP username and password form, and the Windows client's
    # logon, lock and unlock calls - which authenticate with a certificate - cannot work.
    # Turn it on for any deployment that relies on either.
    #
    # No keystore or truststore is packaged. With SSL_ENABLED=true, set SERVER_SSL_KEYSTORE and
    # SERVER_SSL_KEYSTOREPASSWORD (the server's key and certificate), and - while client-auth
    # asks for certificates - SERVER_SSL_TRUSTSTORE and SERVER_SSL_TRUSTSTOREPASSWORD (only the
    # CAs whose client certificates may sign in). Without them the application refuses to
    # start (config.SslStoresCheck) rather than fall back to a default it should not trust.
    enabled: ${SSL_ENABLED:false}
    key-store-type: PKCS12
    client-auth: want
    trust-store-type: PKCS12
  servlet:
    session:
      # Sessions before sign-in (the consent banner, the login form) expire like signed-in ones; signed-in
      # sessions follow ens.session (ENS_SESSION_IDLE_TIMEOUT, and the administrators' own).
      timeout: ${ENS_SESSION_IDLE_TIMEOUT:30m}
      cookie:
        http-only: true
        # Lax: the browser leaves the session cookie off another site's posts and scripted requests (the CSRF
        # token refuses those as well), but still sends it when someone follows a link from elsewhere. Strict
        # would leave it off there too, and the link in an absence notification e-mail would then open the
        # sign-in page instead of the notification.
        same-site: lax
        # Secure whenever ReadyRoom serves TLS itself; Tomcat also marks it Secure on any request it sees as
        # HTTPS. Behind a proxy that terminates TLS, set ENS_COOKIE_SECURE=true, or have ReadyRoom read the
        # proxy's X-Forwarded-Proto (SERVER_FORWARD_HEADERS_STRATEGY=framework). SESSION_COOKIE_SECURE is the
        # older name for ENS_COOKIE_SECURE and still works.
        secure: ${ENS_COOKIE_SECURE:${SESSION_COOKIE_SECURE:${SSL_ENABLED:false}}}

logging:
  # Structured JSON logs: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Elastic Common Schema; logstash and gelf also
  # work). Unset: the usual text lines. The audit lines (logger ens.audit) are raw JSON either way.
  level:
    root: info
    # Application logging. INFO covers state changes: check-in/out records written,
    # permission grants, report generation, org-chart rebuilds and scheduled-job
    # summaries. Set to debug for per-query detail, timings and authorization
    # decisions when diagnosing an issue.
    com.winllc.innoutwork: info

spring:
  datasource:
    # Defaults name the services in docker-compose.yml, so "docker compose up" needs no overrides.
    # Each part is overridable for anything else: DB_HOST=db.internal, and so on. To run the app
    # outside a container against the compose services, use the local profile
    # (application-local.yml), which points these at localhost and the published ports.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:secret123}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Off: otherwise a web request holds its database connection until it finishes, including while it
    # waits on LDAP, and a slow directory can exhaust the connection pool.
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration; db/README.md). Hibernate only checks, at
      # startup, that the tables and columns it maps are there.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          # saveAll() only reaches the database as batches when this is set; the
          # directory refresh writes its changed rows in one round trip per batch.
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    # Migrates the schema at startup, before anything else touches the database. A database an earlier
    # ReadyRoom created (Hibernate, before Flyway) has tables but no flyway_schema_history: Flyway refuses
    # such a schema unless told to baseline it, so it is recorded at version 0 and V1 then runs on it as on
    # an empty one (V1 only adds what is missing). An empty database is not baselined; V1 just runs.
    baseline-on-migrate: true
    baseline-version: "0"
    baseline-description: "Schema created before Flyway (Hibernate ddl-auto: update)"
    # Optional separate migration account, so the application's own account can be limited to reading and
    # writing rows: SPRING_FLYWAY_USER and SPRING_FLYWAY_PASSWORD (same database URL). Unset, Flyway uses
    # DB_USERNAME / DB_PASSWORD. See "Database migrations" in the README for the grants.
  ldap:
    # As above: the compose service name by default, overridable per part.
    urls: ldap://${LDAP_HOST:openldap}:${LDAP_PORT:389}
    username: ${LDAP_USERNAME:cn=admin,dc=winllc,dc=com}
    password: ${LDAP_PASSWORD:adminpassword}
    # Timeouts in milliseconds; without them an unresponsive directory holds requests indefinitely.
    # Pooling is on by default (application.ldap.pooled); see LdapConnectionConfig.
    base-environment:
      "[com.sun.jndi.ldap.connect.timeout]": 5000
      "[com.sun.jndi.ldap.read.timeout]": 30000
  task:
    scheduling:
      # One thread per scheduled job, so a slow run of one does not delay the others.
      pool:
        size: 3
  jackson:
    time-zone: America/New_York
  #base: dc=winllc,dc=com
    #username: cn=directory manager
    #password: secret1234
    date-format: yyyy-MM-dd HH:mm a z
  mail:
    host: mailcow.winllc-dev.com
    port: 587
    username: user1@winllc-dev.com
    password: password
    properties:
        mail:
            smtp:
              ssl:
                trust: "*"
              auth: true
              starttls:
                enable: true

  # thymeleaf:
 #   prefix: classpath:/templates/
#    suffix: .html
 #   cache: false   # disable caching for dev
#   mode: HTML

# The ENS Solutions license is not configured here. It is read from ENS_LICENSE_FILE and
# ENS_LICENSE_STATE_DIR (environment only); see Licensing in the README.

# The audit trail (ens-audit/1): every option comes from an ENS_AUDIT_* environment variable. See
# "Audit logging" in the README. The store (the audit_events table) is always on; these are its outputs.
ens:
  # Content-Security-Policy-Report-Only instead of Content-Security-Policy: reported on, not enforced. An
  # escape hatch for a page the policy breaks (web.SecurityHeadersFilter).
  csp:
    report-only: ${ENS_CSP_REPORT_ONLY:false}
  # The DoD notice-and-consent banner before sign-in (security.ConsentFilter). The text: ENS_CONSENT_BANNER_FILE
  # wins over ENS_CONSENT_BANNER_TEXT; both empty, the standard DoD text.
  consent-banner:
    enabled: ${ENS_CONSENT_BANNER_ENABLED:false}
    title: ${ENS_CONSENT_BANNER_TITLE:}
    text: ${ENS_CONSENT_BANNER_TEXT:}
    file: ${ENS_CONSENT_BANNER_FILE:}
  # Browser session lifetimes (security.SessionControls), as Spring durations (30m, 12h). The administrators'
  # idle timeout defaults to everyone's; max-per-user 0 is no limit, otherwise the oldest session is ended.
  session:
    idle-timeout: ${ENS_SESSION_IDLE_TIMEOUT:30m}
    admin-idle-timeout: ${ENS_SESSION_ADMIN_IDLE_TIMEOUT:}
    absolute-timeout: ${ENS_SESSION_ABSOLUTE_TIMEOUT:12h}
    max-per-user: ${ENS_SESSION_MAX_PER_USER:0}
  # Client-certificate (CAC/PIV) sign-in (security.x509; README "Client certificates"). source: servlet when
  # ReadyRoom terminates TLS, header behind a TLS-terminating proxy (which must send the certificate in
  # header, come from trusted-proxies, and send proxy-secret in X-ENS-Proxy-Secret). user-filter blank keeps
  # "the subject DN is the directory DN". revocation: off, ocsp, crl or ocsp-then-crl.
  x509:
    source: ${ENS_X509_SOURCE:servlet}
    header: ${ENS_X509_HEADER:X-SSL-Client-Cert}
    trusted-proxies: "${ENS_X509_TRUSTED_PROXIES:127.0.0.1/32;::1/128}"
    proxy-secret: ${ENS_X509_PROXY_SECRET:}
    proxy-secret-file: ${ENS_X509_PROXY_SECRET_FILE:}
    trusted-ca-file: ${ENS_X509_TRUSTED_CA_FILE:}
    user-filter: ${ENS_X509_USER_FILTER:}
    allowed-issuers: ${ENS_X509_ALLOWED_ISSUERS:}
    revocation: ${ENS_X509_REVOCATION:off}
    ocsp-responder-url: ${ENS_X509_OCSP_RESPONDER_URL:}
    crl-dir: ${ENS_X509_CRL_DIR:}
    revocation-fail: ${ENS_X509_REVOCATION_FAIL:closed}
    revocation-cache: ${ENS_X509_REVOCATION_CACHE:10m}
  audit:
    # Each event as one raw JSON line on stdout, logger ens.audit (Docker logs, Splunk UF).
    stdout: ${ENS_AUDIT_STDOUT:true}
    # Also append the lines to this file, rotated daily or at 100 MB, keeping ENS_AUDIT_FILE_KEEP.
    file: ${ENS_AUDIT_FILE:}
    file-keep: ${ENS_AUDIT_FILE_KEEP:30}
    # Days to keep events; 0 keeps them forever.
    retention-days: ${ENS_AUDIT_RETENTION_DAYS:0}
    splunk:
      url: ${ENS_AUDIT_SPLUNK_URL:}
      token: ${ENS_AUDIT_SPLUNK_TOKEN:}
      token-file: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:}
      index: ${ENS_AUDIT_SPLUNK_INDEX:}
      sourcetype: ${ENS_AUDIT_SPLUNK_SOURCETYPE:ens:audit}
      insecure: ${ENS_AUDIT_SPLUNK_INSECURE:false}
    syslog:
      host: ${ENS_AUDIT_SYSLOG_HOST:}
      port: ${ENS_AUDIT_SYSLOG_PORT:}
      protocol: ${ENS_AUDIT_SYSLOG_PROTOCOL:tcp}
      facility: ${ENS_AUDIT_SYSLOG_FACILITY:local0}

management:
  endpoints:
    web:
      exposure:
        # Health only, which anyone may read (status only; details for ADMIN): the container healthcheck and
        # the Kubernetes probes (/actuator/health/liveness, /readiness) use it. env and metrics expose the
        # configuration and the runtime; anything added here needs an ADMIN sign-in (SecurityConfig).
        # With MANAGEMENT_SERVER_PORT set, actuator moves to that port and also exposes prometheus there
        # (config.ManagementPortExposure), both open without sign-in: keep that port off any ingress or route.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
      group:
        # Liveness is the application's own state only: a database or directory outage must not restart it.
        # Readiness adds what ReadyRoom cannot serve without. The mail server is in neither.
        readiness:
          include: readinessState, db, ldap, auditStore
  server:
    # The management port, when set, is plain HTTP for the probes and Prometheus inside the cluster, even
    # with SSL_ENABLED on the application's port.
    ssl:
      enabled: false
  metrics:
    tags:
      application: readyroom
application:
  # Read-only demo. Visitors still sign in; what it changes is that nothing can be written and that
  # the accounts listed under demo.accounts are published on the login page for visitors to pick a
  # role from. Off here, and with no accounts, so nothing is published by default.
  #
  # Switch it on only for an instance whose directory and database hold data that is safe for anyone
  # who can reach the login page to read - publishing the credentials makes it exactly that. The demo
  # profile (application-demo.yml) turns it on and lists the seeded accounts.
  demo:
    enabled: false
    banner: "DEMO - read only"
    accounts: []

  user-base-dn: dc=winllc,dc=com
  # Identifies user entries. Used on its own to enumerate users and counted, and combined
  # into a larger AND for name search, reports and the org chart. Defaults to this value;
  # set it for a directory that models people as something else, or to narrow the set
  # further, e.g. (&(objectclass=inetOrgPerson)(!(employeeType=CONTRACTOR))).
  # Surrounding parentheses are added if omitted.
  user-ldap-filter: (objectclass=inetOrgPerson)

  # Directory -> database metadata refresh. Values are milliseconds; set enabled to
  # false to stop the sweep without removing the schedule.
  refresh-user-records-cron:
    enabled: true
    fixed-rate: 3600000
    initial-delay: 300000

  banner-text: BANNER TEXT
  timezone: America/New_York
  user-ldap-employee-type-attribute: employeeType
  user-ldap-organization-attribute: o
  user-ldap-location-attribute: l
  super-user-dns:
    - CN=user3,OU=Users,DC=winllc,DC=com
    # The account the demo profile presents, seeded by test/seed-mock-data.sh. Listed here rather
    # than only in test/application.yml because the container runs on the packaged config - the
    # mounted additional-location is commented out in docker-compose.yml - so an entry only there
    # would not reach it. Demo mode grants every role regardless; this is what makes the account
    # an administrator when signed in normally (demo / password).
    - CN=Demo Admin,OU=Users,DC=winllc,DC=com
  groups:
    - groups-base-dn: ou=Groups,dc=winllc,dc=com
    - groups-base-dn: ou=Companies,dc=winllc,dc=com
  update-profile-url: https://google.com
  checkOutAfterMinutes: 2
  inactive-cron:
    fixed-rate: 60000
    initial-delay: 60000
  send-absent-notification-cron:
    fixed-rate: 300000
    initial-delay: 1
  notification-sender-email: user1@winllc-dev.com
  user-ldap-manager-id-attribute: title
  manager-ldap-id-attribute: street
  application-base-url: ${APPLICATION_BASE_URL:http://localhost:8181}
  duty-sub-org-groups-base-dn: ou=Groups,dc=winllc,dc=com
  user-ldap-duty-sub-organization-attribute: departmentNumber
  duty-sub-org-filter: (departmentNumber=*)
  ldap:
    pooled: true
    # Entries per page for large searches, below the directory's size limit; 0 turns paging off.
    page-size: 500
    # How long a user's group memberships are cached; 0 turns the cache off.
    group-membership-cache-seconds: 300
  diagnostics:
    # Log SQL statement and LDAP operation counts for every request. For measuring, not normal running.
    request-metrics: false
  windows-auth:
    # Windows (Kerberos) sign-in for the Windows client's check-in, lock and unlock calls, alongside client
    # certificates. Off: nothing about sign-in changes. See the README before turning it on.
    enabled: false
    # service-principal: HTTP/inout.winllc.com@WINLLC.COM
    # keytab-location: /etc/in-n-out/http.keytab
    # Directory attribute holding the Windows account name. Active Directory: sAMAccountName (default), or
    # userPrincipalName with strip-realm: false.
    account-attribute: sAMAccountName
    strip-realm: true
  logoff:
    # The Windows client's logoff (POST /api/check/out) runs after the user's profile has gone and cannot sign
    # in, so it sends back the session id its logon was answered with. That id identifies one logoff, of the
    # user who logged on, for this long after the logon (a week: workstations stay logged on over weekends
    # and long shifts); a later or second logoff with it is refused.
    session-max-age-hours: 168
    # Refused logoffs without a sign-in (unknown, used or expired session id) from one client address per
    # minute. Past it, refused ones get 429 and only the first is audited. A logoff with a usable session id
    # is always accepted and never counted, so workstations behind one NAT address or proxy are not held
    # back. 0 turns the limit off.
    refused-per-minute: 30
