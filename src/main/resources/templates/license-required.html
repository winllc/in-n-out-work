<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>License required</title>
</head>
<body>

<span layout:fragment="page-title">License required</span>

<div layout:fragment="content">

    <div class="card">
        <div class="card-body">
            <div class="empty" id="license-required">
                <div class="empty-icon text-secondary">
                    <i class="ti ti-lock fs-1"></i>
                </div>
                <p class="empty-title" th:text="${title}">Not licensed</p>
                <p class="empty-subtitle text-secondary" th:text="${message}">
                    This is not included in this installation's license.
                </p>
                <p class="empty-subtitle text-secondary small">
                    Everything else in ReadyRoom keeps working.
                    <span sec:authorize="hasAuthority('ADMIN')">
                        See <a th:href="@{/app/admin/license}">the license screen</a> for what the license includes.
                    </span>
                    <span sec:authorize="!hasAuthority('ADMIN')">Ask your administrator about the license.</span>
                </p>
                <div class="empty-action">
                    <a th:href="@{/app}" class="btn btn-primary">
                        <i class="ti ti-home me-1"></i>Take me home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
