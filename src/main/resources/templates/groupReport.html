<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
    <script th:src="@{/libs/fullcalendar/index.global.min.js}"></script>


</head>
<body>
<div layout:fragment="content">


    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-center">
                <div>
                    <h3>Group Report</h3>
                </div>
            </div>

            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>

            <!-- Display error message if present -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <table class="table">
                        <tbody>
                        <tr>
                            <td>Group Name</td>
                            <td><span th:text="${report.groupName}"></span></td>
                        </tr>
                        <tr>
                            <td>From Date</td>
                            <td><span th:text="${report.getFromDate()}"></span></td>
                        </tr>
                        <tr>
                            <td>To Date</td>
                            <td><span th:text="${report.getToDate()}"></span></td>
                        </tr>
                        <tr>
                            <td>Users in Group</td>
                            <td><span th:text="${report.getUserReports().size()}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <h3>Day Reports</h3>
                    <div class="card" th:each="dayReport : ${report.getDayReports()}">
                        <h5 class="card-header" th:text="${dayReport.getDate()}"></h5>

                        <div class="card-body">
                            <table class="table table-responsive">
                                <tbody>
                                <tr>
                                    <td>Total Check-Ins</td>
                                    <td><span th:text="${dayReport.getTotalLoggedIn()}"></span></td>
                                </tr>
                                <tr>
                                    <td>Total Check-Outs</td>
                                    <td><span th:text="${dayReport.getTotalLoggedOut()}"></span></td>
                                </tr>
                                <tr>
                                    <td>Employee Type Stats</td>
                                    <td>
                                        <table class="table table-responsive">
                                            <tbody>
                                            <tr th:each="entry : ${dayReport.getEmployeeTypeCounts()}">
                                                <td th:text="${entry.key}"></td>
                                                <td th:text="${entry.value}"></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Location Stats</td>
                                    <td>
                                        <table class="table table-responsive">
                                            <tbody>
                                            <tr th:each="entry : ${dayReport.getLocationCounts()}">
                                                <td th:text="${entry.key}"></td>
                                                <td th:text="${entry.value}"></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Organization Stats</td>
                                    <td>
                                        <table class="table table-responsive">
                                            <tbody>
                                            <tr th:each="entry : ${dayReport.getOrgCounts()}">
                                                <td th:text="${entry.key}"></td>
                                                <td th:text="${entry.value}"></td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <h3>User Reports</h3>
                    <div class="card" th:each="userReport : ${report.getUserReports()}">
                        <h5 class="card-header" th:text="${userReport.userDn}"></h5>
                        <div class="card-body">
                            <table class="table table-responsive">
                                <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Status</th>
                                    <th>Check-In Time</th>
                                    <th>Check-Out Time</th>
                                    <th>Duration</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="dayReport : ${userReport.dayReports}">
                                    <td><span th:text="${dayReport.getFormatedDay()}"></span></td>
                                    <td><span th:text="${dayReport.status}"></span></td>
                                    <td><span th:text="${dayReport.getCheckInTime()}"></span></td>
                                    <td><span th:text="${dayReport.getCheckOutTime()}"></span></td>
                                    <td><span th:text="${dayReport.getCheckedInPeriod()}"></span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
