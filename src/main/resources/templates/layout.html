<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title layout:title-pattern="In-N-Out-Work">In-N-Out-Work</title>
    <link rel="stylesheet" th:href="@{/css/styles.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>

    <link rel="stylesheet"
          th:href="@{/css/treeview/treeview.css}"/>
    <link rel="stylesheet"
          th:href="@{/libs/flatpickr/flatpickr.min.css}"/>

    <script th:src="@{/libs/flatpickr/flatpickr.min.js}"></script>

    <script th:src="@{/libs/treeview/treeview.js}"></script>


</head>
<body>

<header class="banner" th:style="'background-color: ' + ${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_COLOR}">
    <span th:text="${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_TEXT}">
        Default Banner
    </span>
</header>

<!--  Body Wrapper -->
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
     data-sidebar-position="fixed" data-header-position="fixed">

    <!-- Sidebar Start -->
    <aside class="left-sidebar">
        <!-- Sidebar scroll-->
        <div>
            <div class="brand-logo d-flex align-items-center justify-content-between">
                <a th:href="@{/app}" class="text-nowrap logo-img">
                    <img th:src="${@environment.getProperty('application.logofile', '/images/logos/in-n-out-inverse.png')}" alt="" style="max-width: 100px; height: auto;"/>
                </a>
                <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                    <i class="ti ti-x fs-6"></i>
                </div>
            </div>
            <!-- Sidebar navigation-->
            <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                <ul id="sidebarnav">
                    <li class="nav-small-cap">
                        <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4"></iconify-icon>
                        <span class="hide-menu">Home</span>
                    </li>
                    <li class="sidebar-item">

                        <a class="sidebar-link" th:href="@{/app/groups}" aria-expanded="false">
                            <i class="ti ti-users"></i>
                            <span class="hide-menu">Groups</span>
                        </a>
                    </li>
                    <li class="sidebar-item" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">

                        <a class="sidebar-link" th:href="@{/app/user/search}" aria-expanded="false">
                            <i class="ti ti-user"></i>
                            <span class="hide-menu">Users</span>
                        </a>
                    </li>

                    <li class="sidebar-item" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">

                        <a class="sidebar-link" th:href="@{/app/metrics}" aria-expanded="false">
                            <i class="ti ti-chart-bar"></i>
                            <span class="hide-menu">Metrics</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- End Sidebar navigation -->
        </div>
        <!-- End Sidebar scroll-->
    </aside>
    <!--  Sidebar End -->
    <!--  Main wrapper -->
    <div class="body-wrapper">
        <!--  Header Start -->
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <ul class="navbar-nav">
                    <li class="nav-item d-block d-xl-none">
                        <a class="nav-link sidebartoggler " id="headerCollapse" href="javascript:void(0)">
                            <i class="ti ti-menu-2"></i>
                        </a>
                    </li>

                </ul>
                <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                    <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">

                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">
                            <input class="form-control" id="dt">
                            <div id="dtHelp" class="form-text row justify-content-center">System Date</div>
                        </li>

                        <li class="nav-item dropdown">
                            <a class="nav-link " href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                               aria-expanded="false">
                                <img th:src="@{/images/profile/user-profile-icon.jpg}" alt="" width="35" height="35"
                                     class="rounded-circle">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                                 aria-labelledby="drop2">
                                <div class="message-body">
                                    <a th:href="@{/app/profile}" class="d-flex align-items-center gap-2 dropdown-item">
                                        <i class="ti ti-user fs-6"></i>
                                        <p class="mb-0 fs-3">My Profile</p>
                                    </a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>
        <!--  Header End -->
        <div class="body-wrapper-inner">
            <div class="container-fluid">
                <main layout:fragment="content">
                    <!-- Child pages inject content here -->
                </main>

            </div>
        </div>

    </div>
</div>

<footer>
    <div class="py-6 px-6 text-center">
        <p class="mb-0 fs-4">Designed and Developed by <a href="https://ens-solutions.com/"
                                                        class="pe-1 text-primary text-decoration-underline">ENS Solutions, LLC</a>
        </p>
    </div>
</footer>

<footer class="footer">
    <span th:text="${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_TEXT}">
        Default Banner
    </span>
</footer>

<script th:src="@{/libs/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/libs/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/sidebarmenu.js}"></script>
<script th:src="@{/js/app.min.js}"></script>
<script th:src="@{/libs/apexcharts/dist/apexcharts.min.js}"></script>
<script th:src="@{/libs/simplebar/dist/simplebar.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
<!-- solar icons -->
<script th:src="@{/libs/iconify/iconify-icon.min.js}"></script>

<script th:inline="javascript">

    const sessionDateTime = /*[[${systemTime}]]*/ null;

    const picker = flatpickr("#dt", {
        enableTime: false,
        dateFormat: "m\\/d\\/Y",
        //time_24hr: true,
        maxDate: "today",
        defaultDate: sessionDateTime,
        onClose: function(selectedDates) {
            if (!selectedDates.length) return;

            sendSelectedDateTime(selectedDates[0]);
        }
    });

    async function sendSelectedDateTime() {
        const selectedDates = picker.selectedDates;

        if (!selectedDates.length) {
            alert("Please select a date and time");
            return;
        }

        // Convert to ISO-8601 (UTC-safe format for APIs)
        const isoDateTime = selectedDates[0].toISOString();

        try {
            const response = await fetch("/api/system/updateSystemTime", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    dateTime: isoDateTime
                })
            });

            window.location.reload();

        } catch (error) {
            console.error("Failed to send date/time:", error);
            alert("Failed to send date/time");
        }
    }


</script>

</body>
</html>
