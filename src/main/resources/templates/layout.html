<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="In-N-Out-Work">In-N-Out-Work</title>

    <!-- Tabler is the app's UI framework; the icon font ships with it. -->
    <link rel="stylesheet" th:href="@{/libs/tabler/tabler.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/icons/tabler-icons/tabler-icons.css}"/>
    <link rel="stylesheet" th:href="@{/libs/tabulator/tabulator.min.css}"/>
    <link rel="stylesheet" th:href="@{/libs/flatpickr/flatpickr.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>

    <script th:src="@{/libs/flatpickr/flatpickr.min.js}"></script>
    <!-- Loaded here so the Tabler-flavoured Tabulator overrides in app.css win. -->
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
    <script th:src="@{/js/custom.js}"></script>

</head>
<body>

<div class="classification-bar classification-bar-top"
     th:style="'background-color: ' + ${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_COLOR}">
    <span th:text="${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_TEXT}">
        Default Banner
    </span>
</div>

<div class="page">

    <!-- Sidebar -->
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#sidebar-menu" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!--
              The default is the white-on-transparent SVG, so the sidebar needs no CSS
              filter to recolour it (filters rasterise the element and pixelate on
              scaled displays). A deployment overriding application.logofile should
              likewise supply light, transparent artwork - ideally vector.
            -->
            <div class="navbar-brand">
                <a th:href="@{/app}">
                    <img style="height: 4rem;" th:src="${@environment.getProperty('application.logofile', '/images/logos/in-n-out-light.svg')}"
                         alt="In-N-Out-Work" class="navbar-brand-image"/>
                </a>
            </div>
            <div class="collapse navbar-collapse" id="sidebar-menu">
                <ul class="navbar-nav pt-lg-3" id="sidebarnav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/app/groups}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-users"></i>
                            </span>
                            <span class="nav-link-title">Groups</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('USER', 'ADMIN', 'MANAGER')">
                        <a class="nav-link" th:href="@{/app/user/search}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-user"></i>
                            </span>
                            <span class="nav-link-title">Users</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('USER', 'ADMIN', 'MANAGER')">
                        <a class="nav-link" th:href="@{/app/user/reports}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-list-check"></i>
                            </span>
                            <span class="nav-link-title">My Reports</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/app/orgchart}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-hierarchy-3"></i>
                            </span>
                            <span class="nav-link-title">Org Chart</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">
                        <a class="nav-link" th:href="@{/app/metrics}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-chart-bar"></i>
                            </span>
                            <span class="nav-link-title">Metrics</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">
                        <a class="nav-link" th:href="@{/app/settings}">
                            <span class="nav-link-icon d-md-none d-lg-inline-block">
                                <i class="ti ti-settings"></i>
                            </span>
                            <span class="nav-link-title">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- Top header -->
    <header class="navbar navbar-expand-md d-print-none">
        <div class="container-xl">

            <!-- Left: notifications -->
            <div class="navbar-nav flex-row align-items-center">
                <div class="nav-item dropdown">
                    <a href="#" class="nav-link px-0" data-bs-toggle="dropdown" id="drop1"
                       aria-label="Show notifications" aria-expanded="false">
                        <i class="ti ti-bell fs-2"></i>
                        <span id="notification-indicator" style="display: none"
                              class="badge bg-red badge-notification"></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-arrow" aria-labelledby="drop1">
                        <div id="notification-list" class="list-group list-group-flush">
                            <span class="dropdown-item text-secondary">Loading&hellip;</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: system date + user menu -->
            <div class="navbar-nav flex-row align-items-center ms-auto">

                <div class="nav-item me-3 d-none d-md-block" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">
                    <input class="form-control form-control-sm" id="dt" aria-describedby="dtHelp">
                    <div id="dtHelp" class="form-hint text-center mb-0">
                        <span th:text="'System Date ('+${systemTimeZone}+')'"></span>
                    </div>
                </div>

                <div class="nav-item dropdown">
                    <a href="#" class="nav-link d-flex lh-1 p-0 px-2" data-bs-toggle="dropdown" id="drop2"
                       aria-label="Open user menu" aria-expanded="false">
                        <span class="avatar avatar-sm"
                              th:style="'background-image: url(' + @{/images/profile/user-profile-icon.jpg} + ')'"></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" aria-labelledby="drop2">
                        <a th:href="@{/app/profile}" class="dropdown-item">
                            <i class="ti ti-user me-2"></i>My Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="page-wrapper">

        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <h2 class="page-title">
                            <span layout:fragment="page-title">In-N-Out-Work</span>
                        </h2>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div class="btn-list" layout:fragment="page-actions"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="container-xl">
                <main layout:fragment="content">
                    <!-- Child pages inject content here -->
                </main>
            </div>
        </div>

        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="row text-center align-items-center flex-row-reverse">
                    <div class="col-12">
                        <p class="mb-0">Designed and Developed by
                            <a href="https://ens-solutions.com/" class="link-secondary">ENS Solutions, LLC</a>
                        </p>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>

<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

<div class="classification-bar classification-bar-bottom"
     th:style="'background-color: ' + ${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_COLOR}">
    <span th:text="${T(com.winllc.innoutwork.config.GlobalProperties).BANNER_TEXT}">
        Default Banner
    </span>
</div>

<script th:src="@{/libs/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/libs/tabler/tabler.min.js}"></script>
<script>
    // Tabler bundles Bootstrap's JS under window.tabler; the pages call bootstrap.Modal
    // directly, so keep the familiar global pointing at it.
    if (window.tabler && window.tabler.bootstrap && !window.bootstrap) {
        window.bootstrap = window.tabler.bootstrap;
    }

    // Highlight the sidebar entry for the page being viewed.
    document.querySelectorAll("#sidebarnav .nav-link").forEach(function (link) {
        const href = link.getAttribute("href");
        if (href && href !== "/" && window.location.pathname.startsWith(href)) {
            link.classList.add("active");
        }
    });
</script>

<script th:inline="javascript">

    const sessionDateTime = /*[[${systemTime}]]*/ null;

    const picker = flatpickr("#dt", {
        enableTime: false,
        dateFormat: "m\\/d\\/Y",
        //time_24hr: true,
        maxDate: "today",
        defaultDate: sessionDateTime,
        onClose: function(selectedDates) {
            if (!selectedDates.length) return;

            sendSelectedDateTime(selectedDates[0]);
        }
    });

    async function sendSelectedDateTime() {
        const selectedDates = picker.selectedDates;

        if (!selectedDates.length) {
            alert("Please select a date and time");
            return;
        }

        // Convert to ISO-8601 (UTC-safe format for APIs)
        const isoDateTime = selectedDates[0].toISOString();

        try {
            const response = await fetch("/api/system/updateSystemTime", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    dateTime: isoDateTime
                })
            });

            window.location.reload();

        } catch (error) {
            console.error("Failed to send date/time:", error);
            alert("Failed to send date/time");
        }
    }

    document.addEventListener("DOMContentLoaded", loadItems);

    const notificationList = document.getElementById("notification-list");

    /* ---------- LOAD ---------- */
    async function loadItems() {
        const response = await fetch("/api/notifications/my");
        const items = await response.json();
        notificationList.innerHTML = "";

        if (items.length > 0) {
            document.getElementById("notification-indicator").style.display = "block";

            const clearAll = document.createElement("button");
            clearAll.className = "btn btn-primary btn-sm w-100 mb-1";
            clearAll.innerHTML = "Mark All Read";
            clearAll.addEventListener("click", markAllAsRead);

            notificationList.appendChild(clearAll);


            for (const item of items) {
                const notiItem = document.createElement("a");
                notiItem.href = "/app/notifications/id/" + item.id;
                notiItem.className = "dropdown-item";
                notiItem.textContent = item.summary;
                notificationList.appendChild(notiItem);
            }
        } else{
            const noItem = document.createElement("span");
            noItem.className = "dropdown-item text-secondary";
            noItem.textContent = "No new notifications";
            notificationList.appendChild(noItem);
        }

    }

    async function markAllAsRead() {
        //const managers = Array.from(selectedItems.values()).map(item => item.dn);
        await fetch("/api/notifications/markAllAsRead", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            //body: JSON.stringify(managers)
        })
            .then(data => {
                console.log("Success:", data);
                showToast("Success", { type: "success" });

                document.getElementById("notification-indicator").style.display = "none";
                notificationList.innerHTML = "";
                const noItem = document.createElement("span");
                noItem.className = "dropdown-item text-secondary";
                noItem.textContent = "No new notifications";
                notificationList.appendChild(noItem);
            })
    }

</script>

</body>
</html>
