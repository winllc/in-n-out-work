<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">

    <div class="row">
        <div class="col-md-11">
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-center">
                        <h3 th:text="'Notification for '+${notificationFor}"></h3>
                    </div>
                </div>
                <div class="card-body">
                    <form th:action="@{/app/notifications/update}" th:object="${form}" method="post">
                        <input type="hidden" th:name="notificationId" th:value="${notification.getId()}"/>

                        <table class="table">
                            <tbody>
                            <tr>
                                <td>Summary</td>
                                <td><span th:text="${notification.getSummary()}"/></td>
                            </tr>
                            <tr>
                                <td>Action</td>
                                <td>
                                    <select class="form-control" th:field="*{response}">
                                        <option th:each="status : ${statuses}" th:text="${status}"
                                                th:value="${status}"></option>
                                    </select>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>

                </div>
            </div>
        </div>

    </div>


</div>
</body>
</html>
