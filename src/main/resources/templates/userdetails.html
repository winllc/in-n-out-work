<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="d-flex justify-content-center">
            <div>
                <h3>Details for <span th:text="${user.dn}"></span></h3>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <table class="table">
                    <tbody>
                    <tr>
                        <td>Current Status</td>
                        <td><span th:text="${user.status}" /></td>
                    </tr>
                    <tr>
                        <td>Organization</td>
                        <td th:text="${user.organization}"></td>
                    </tr>
                    <tr>
                        <td>Employee Type</td>
                        <td th:text="${user.employeeType}"></td>
                    </tr>

                    <tr>
                        <td>Notes</td>
                        <td><span th:text="${user.notes}" /></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Member Of</h3>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tbody>
                            <tr th:each="group : ${user.memberOf}">
                                <td>
                                    <a th:href="@{'/app/users/'+${group.dn}}" th:text="${group.cn}"></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Audit Log</h3>
                    </div>
                    <div class="card-body">
                        <div id="audit-table"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6" sec:authorize="hasAuthority('ADMIN')">
                <div class="card">
                    <div class="card-header">
                        <h3>Role</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/app/user/details}" method="post" th:object="${user}">
                            <input type="hidden" th:field="*{dn}" />
                            <select class="form-select" id="role" th:field="*{role}">
                                <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.name()}"></option>
                            </select>

                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
        <div class="row">
            <div class="col-md-12" sec:authorize="hasAnyAuthority('ADMIN', 'MANAGER')">
                <div id='calendar'></div>
            </div>
        </div>
    </div>


    <script th:inline="javascript">

        const table = new Tabulator("#audit-table", {
            ajaxURL: "/api/users/checkinoutrecords/"+/*[[${user.dn}]]*/ "test",

            ajaxResponse: function (url, params, response) {
                // Tabulator expects array of row data
                console.log("Server response:", response);
                return {
                    data: response.content,
                    last_page: response.page.totalPages,
                    total_records: response.page.totalElements
                };
            },
            pagination: true,
            paginationMode: "remote",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout:"fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "Timestamp", field: "timestamp"},
                {title: "Action", field: "action"}

            ],
        });

        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek'
                },
                didMount: function () {
                    addDropdownsToDays();
                },
                datesSet: function () {
                    addDropdownsToDays();
                }
            });

            calendar.render();

            function addDropdownsToDays() {
                const dayCells = document.querySelectorAll('.fc-daygrid-day');

                dayCells.forEach(cell => {

                    if (cell.querySelector('.wrap-with-underscores')) return;

                    const dateStr = cell.getAttribute('data-date');
                    console.log(dateStr);

                    const response = fetch("/api/event/day", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            date: dateStr
                        })
                    })
                        .then(response => {
                            // Optional: Handle HTTP errors
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            // Return the promise from the data extraction method
                            return response.json();
                        })
                        .then(data => {
                            console.log(data);
                            const dropdownContainer = document.createElement('div');
                            dropdownContainer.className = 'wrap-with-underscores';
                            dropdownContainer.innerHTML = data.status;

                            cell.appendChild(dropdownContainer);
                        });


                });
            }

        });

    </script>
</div>
</body>
</html>
