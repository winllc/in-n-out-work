<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <script th:src="@{/libs/fullcalendar/index.global.min.js}"></script>
</head>
<body>

<span layout:fragment="page-title" th:text="${user.cn}">User</span>

<div layout:fragment="content">

    <div class="row row-cards">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">User Information</h3>
                    <div class="card-actions">
                        <span class="badge"
                              th:classappend="${user.status == 'IN'} ? 'bg-green-lt' : (${user.status == 'OUT'} ? 'bg-blue-lt' : (${user.status == 'AWAY'} ? 'bg-purple-lt' : 'bg-secondary-lt'))"
                              th:text="${user.status}"></span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="datagrid">
                        <div class="datagrid-item">
                            <div class="datagrid-title">Organization</div>
                            <div class="datagrid-content" th:text="${user.organization}"></div>
                        </div>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Employee Type</div>
                            <div class="datagrid-content" th:text="${user.employeeType}"></div>
                        </div>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Location</div>
                            <div class="datagrid-content" th:text="${user.location}"></div>
                        </div>
                        <div class="datagrid-item" th:if="${user.branch != null}">
                            <div class="datagrid-title">Branch</div>
                            <div class="datagrid-content" th:text="${user.branch}"></div>
                        </div>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Email</div>
                            <div class="datagrid-content" th:text="${user.email}"></div>
                        </div>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Phone</div>
                            <div class="datagrid-content" th:text="${user.phoneNumber}"></div>
                        </div>
                        <div class="datagrid-item" th:if="${user.managerDn != null}">
                            <div class="datagrid-title">Manager</div>
                            <div class="datagrid-content wrap-with-underscores" th:text="${user.managerDn}"></div>
                        </div>
                        <div class="datagrid-item" th:if="${user.averageLoginTime != null}">
                            <div class="datagrid-title">Average Login Time</div>
                            <div class="datagrid-content" th:text="${user.averageLoginTime}"></div>
                        </div>
                        <div class="datagrid-item">
                            <div class="datagrid-title">Notes</div>
                            <div class="datagrid-content" th:text="${user.notes}"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Member Of</h3>
                </div>

                <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(user.memberOf)}">
                    <a class="list-group-item list-group-item-action d-flex align-items-center"
                       th:each="group : ${user.memberOf}"
                       th:href="@{'/app/users/'+${group.dn}}">
                        <span class="avatar avatar-xs bg-blue-lt me-2">
                            <i class="ti ti-users"></i>
                        </span>
                        <span class="text-truncate" th:text="${group.cn}"></span>
                    </a>
                </div>

                <div class="card-body" th:if="${#lists.isEmpty(user.memberOf)}">
                    <div class="empty">
                        <div class="empty-icon">
                            <i class="ti ti-users fs-1"></i>
                        </div>
                        <p class="empty-title">No group memberships</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-cards mt-1" th:if="${isGroupManager}">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Audit Log</h3>
                </div>
                <div class="card-body">
                    <div id="audit-table"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-6" sec:authorize="hasAuthority('ADMIN')">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Role</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/app/user/details}" method="post" th:object="${user}">
                        <input type="hidden" th:field="*{dn}"/>
                        <div class="mb-3">
                            <label class="form-label" for="role">Application role</label>
                            <select class="form-select" id="role" th:field="*{role}">
                                <option th:each="role : ${roles}" th:value="${role.name()}"
                                        th:text="${role.name()}"></option>
                            </select>
                            <small class="form-hint">Controls what this user can see across the app.</small>
                        </div>
                        <div class="btn-list">
                            <button type="submit" class="btn btn-primary">
                                <i class="ti ti-device-floppy me-1"></i>Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <div class="row row-cards mt-1" th:if="${isGroupManager}">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Event Calendar</h3>
                </div>
                <div class="card-body">
                    <div id='calendar'></div>
                </div>
            </div>
        </div>
    </div>


    <script th:inline="javascript">

        const userDn = /*[[${user.dn}]]*/ "test";

        const table = new Tabulator("#audit-table", {
            ajaxURL: "/api/users/checkinoutrecords/" + userDn,

            ajaxResponse: function (url, params, response) {
                // Tabulator expects array of row data
                console.log("Server response:", response);
                return {
                    data: response.content,
                    last_page: response.page.totalPages,
                    total_records: response.page.totalElements
                };
            },
            pagination: true,
            paginationMode: "remote",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout: "fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "Timestamp", field: "timestamp"},
                {title: "Action", field: "action"}

            ],
        });

        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                themeSystem: 'bootstrap5',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,dayGridWeek'
                },
                events: function (fetchInfo, successCallback, failureCallback) {
                    fetch(`/api/event/allWithLogins?dn=${userDn}&from=${fetchInfo.startStr}&to=${fetchInfo.endStr}`)
                        .then(res => res.json())
                        .then(data => successCallback(data))
                        .catch(err => failureCallback(err));
                }
            });

            calendar.render();

        });

    </script>
</div>
</body>
</html>
