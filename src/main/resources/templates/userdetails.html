<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="d-flex justify-content-center">
            <div>
                <h3>Details for <span th:text="${user.dn}"></span></h3>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <table class="table">
                    <tbody>
                    <tr>
                        <td>Current Status</td>
                        <td><span th:text="${user.status}" /></td>
                    </tr>
                    <tr>
                        <td>Organization</td>
                        <td th:text="${user.organization}"></td>
                    </tr>
                    <tr>
                        <td>Employee Type</td>
                        <td th:text="${user.employeeType}"></td>
                    </tr>

                    <tr>
                        <td>Notes</td>
                        <td><span th:text="${user.notes}" /></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Member Of</h3>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tbody>
                            <tr th:each="group : ${user.memberOf}">
                                <td>
                                    <a th:href="@{'/app/users/'+${group.dn}}" th:text="${group.cn}"></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Audit Log</h3>
                    </div>
                    <div class="card-body">
                        <div id="audit-table"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6" sec:authorize="hasAuthority('ADMIN')">
                <div class="card">
                    <div class="card-header">
                        <h3>Role</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/app/user/details}" method="post" th:object="${user}">
                            <input type="hidden" th:field="*{dn}" />
                            <select class="form-select" id="role" th:field="*{role}">
                                <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.name()}"></option>
                            </select>

                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script th:inline="javascript">

        const table = new Tabulator("#audit-table", {
            ajaxURL: "/api/users/checkinoutrecords/"+/*[[${user.dn}]]*/ "test",

            ajaxResponse: function (url, params, response) {
                // Tabulator expects array of row data
                console.log("Server response:", response);
                return {
                    data: response.content,
                    last_page: response.page.totalPages,
                    total_records: response.page.totalElements
                };
            },
            pagination: true,
            paginationMode: "remote",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout:"fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "Timestamp", field: "timestamp"},
                {title: "Action", field: "action"}

            ],
        });


    </script>
</div>
</body>
</html>
