<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">
    <h3>User Table for <span th:text="${group}"></span></h3>
    <div id="user-table"></div>

    <script th:inline="javascript">
        const groupName = /*[[${group}]]*/ "test";

        const table = new Tabulator("#user-table", {
            ajaxURL: "/api/users/group/" + groupName,

            ajaxResponse: function (url, params, response) {
                // Tabulator expects array of row data
                return response.data;
            },
            pagination: "local",
            paginationSize: 10,
            layout:"fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "DN", field: "dn", headerFilter: "input"},
                {title: "Checked In", field: "checkedIn", formatter: function(cell){
                    let value = cell.getValue();

                    if(value === true){
                        cell.getElement().style.color = "green";
                    }else{
                        cell.getElement().style.color = "gray";
                    }
                    return value === true ? "Yes" : "No";
                    }},
                {title: "Screen Locked", field: "locked", formatter: function(cell){
                        let value = cell.getValue();
                        let checkedIn = cell.getRow().getData().checkedIn;

                        if(checkedIn === true) {

                            if (value === true) {
                                cell.getElement().style.color = "gray";
                            } else {
                                cell.getElement().style.color = "green";
                            }
                            return value === true ? "Yes" : "No";
                        }else{
                            return "N/A";
                        }
                    }},
                {title: "Log In", field: "checkedInAt"},
                {title: "Log Out", field: "checkedOutAt"},
                {title: "Notes", field: "notes"}
            ],
        });

        table.on("rowClick", function(e, row){
            const data = row.getData();
            window.location.href = `/app/user/details/${data.dn}`;
        });

    </script>
</div>
</body>
</html>
