<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>User Search</title>
</head>
<body>

<span layout:fragment="page-title">User Search</span>

<div layout:fragment="content">

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Find a user</h3>
            <div class="card-actions">
                <label class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="advanced-btn">
                    <span class="form-check-label">Advanced</span>
                </label>
            </div>
        </div>
        <div class="card-body border-bottom py-3">
            <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="ti ti-search"></i>
                        </span>
                        <input id="search-input" type="text" class="form-control" placeholder="Search name..."
                               aria-label="Search name..." aria-describedby="search-btn">
                        <button id="search-btn" class="btn btn-primary" type="button">Search</button>
                    </div>
                    <small class="form-hint">Enter at least three characters.</small>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div id="user-table"></div>
        </div>
    </div>


    <script th:inline="javascript">

        var searchTerm = "";

        // Status colours come from Tabler's badge palette so the table matches the rest of the UI.
        const STATUS_BADGES = {
            IN: "bg-green-lt",
            OUT: "bg-blue-lt",
            AWAY: "bg-purple-lt",
            NONE: "bg-secondary-lt"
        };

        function statusFormatter(cell) {
            const value = cell.getValue();
            const badge = STATUS_BADGES[value];
            return badge ? `<span class="badge ${badge}">${value}</span>` : (value ?? "");
        }

        const table = new Tabulator("#user-table", {

            ajaxParams: () => ({
                search: searchTerm,
            }),
            pagination: true,
            paginationMode: "local",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout: "fitDataStretch", //fit columns to width of table (optional)
            layoutColumnsOnNewData: true,
            placeholder: "Search for a user by name",
            columns: [
                {title: "Name", field: "cn", minWidth: 100, resizable: true},
                {title: "DN", field: "dn", minWidth: 150, visible: false, resizable: true},
                {title: "Status", field: "status", formatter: statusFormatter},
                {title: "Checked In", field: "checkedInAt", visible: false, resizable: true},
                {title: "Last Status Change", field: "lastStatusChangeAt", resizable: true},
                {title: "Checked Out", field: "checkedOutAt", visible: false, resizable: true},
                {title: "Notes", field: "notes", widthGrow: 3}
            ],
        });

        table.on("tableBuilt", function () {
            table.element.classList.add("table-clickable");
        });

        table.on("rowClick", function (e, row) {
            const data = row.getData();
            window.location.href = `/app/user/details/${data.dn}`;
        });

        document.getElementById("search-input").addEventListener("keydown", function (event) {
            // Check if the key pressed is "Enter"
            if (event.key === "Enter") {
                // Prevent the default form submission behavior (if the input is in a form)
                event.preventDefault();
                updateTable();
            }
        });

        document.getElementById("search-btn").addEventListener("click", (event) => {
            event.preventDefault()

            updateTable();
        });

        function updateTable() {
            searchTerm = document.getElementById("search-input").value;
            if (searchTerm.length >= 3) {
                table.setData("/api/users/search"); // reload table with new search
            } else {
                alert("Search must be 3 characters or more");
            }
        }

        document.getElementById("advanced-btn").addEventListener("change", (event) => {

            if ((event.target.checked)) {
                table.showColumn("checkedInAt");
                table.showColumn("checkedOutAt");
                table.showColumn("dn");
                table.hideColumn("cn");
            } else {
                table.hideColumn("checkedInAt");
                table.hideColumn("checkedOutAt");
                table.hideColumn("dn");
                table.showColumn("cn");
            }
            table.redraw(true);

        });

    </script>
</div>
</body>
</html>
