<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">
    <h3>User Table</h3>

    <div style="margin: 1em 0;">
        <input id="search-input" type="text" placeholder="Search name..." style="padding: 6px;">
        <button type="submit" id="search-btn" class="btn btn-primary">Search</button>
    </div>

    <div id="user-table"></div>

    <script th:inline="javascript">

        var searchTerm = "";

        const table = new Tabulator("#user-table", {

            ajaxParams: () => ({
                search: searchTerm,
            }),
            pagination: true,
            paginationMode: "local",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout:"fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "DN", field: "dn"},
                {title: "Checked In", field: "checkedIn"},
                {title: "Log In", field: "checkedInAt"},
                {title: "Log Out", field: "checkedOutAt"},
                {title: "Notes", field: "notes"}
            ],
        });

        table.on("rowClick", function(e, row){
            const data = row.getData();
            window.location.href = `/app/user/details/${data.dn}`;
        });

        document.getElementById("search-btn").addEventListener("click", () => {
            searchTerm = document.getElementById("search-input").value;
            if(searchTerm.length >= 3) {
                table.setData("/api/users/search"); // reload table with new search
            }else{
                alert("Search must be 3 characters or more");
            }
        });

    </script>
</div>
</body>
</html>
