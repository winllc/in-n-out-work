<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">
    <h3>User Table</h3>

    <div style="margin: 1em 0;">
        <input id="search-input" type="text" placeholder="Search name..." style="padding: 6px;">
        <button type="button" id="search-btn" class="btn btn-primary">Search</button>
    </div>

    <div id="user-table"></div>

    <script th:inline="javascript">

        var searchTerm = "";

        const table = new Tabulator("#user-table", {
            ajaxURL: "/api/users/search",

            ajaxResponse: function (url, params, response) {
                // Tabulator expects array of row data
                console.log("Server response:", response);
                return {
                    data: response.content,
                    last_page: response.page.totalPages,
                    total_records: response.page.totalElements
                };
            },
            ajaxParams: () => ({
                search: searchTerm,
            }),
            pagination: true,
            paginationMode: "remote",
            paginationSize: 10,
            paginationInitialPage: 1,
            layout:"fitColumns", //fit columns to width of table (optional)
            columns: [
                {title: "DN", field: "dn"},
                {title: "Checked In", field: "checkedIn"},
                {title: "Log In", field: "checkedInAt"},
                {title: "Log Out", field: "checkedOutAt"},
                {title: "Notes", field: "notes"}
            ],
        });

        table.on("rowClick", function(e, row){
            const data = row.getData();
            window.location.href = `/app/user/details/${data.dn}`;
        });

        document.getElementById("search-btn").addEventListener("click", () => {
            searchTerm = document.getElementById("search-input").value;
            table.setData(); // reload table with new search
        });

    </script>
</div>
</body>
</html>
