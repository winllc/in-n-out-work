<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
    <script th:src="@{/libs/chartjs/chart.js}"></script>
</head>
<body>
<div layout:fragment="content">

    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-center">
                <h2>Metrics</h2>
            </div>

            <div class="row pb-10">
                <div class="col-md-5 mx-auto">
                    <div class="d-flex justify-content-center">
                        <h3>Current User Statuses</h3>
                    </div>
                    <canvas id="myChart"></canvas>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mx-auto">
                    <div class="d-flex justify-content-center">
                        <h3>Today's Activity</h3>
                    </div>
                    <canvas id="myChart2"></canvas>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <h3>By Organization</h3>

                    <div th:each="org : ${data.getOrgStatusCounts()}">
                        <h4 th:text="${org.getKey()}"></h4>
                        <table>
                            <thead>
                            <tr>
                                <th>Status</th>
                                <th>Count</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="status : ${org.getValue()}">
                                <td th:text="${status.key}"></td>
                                <td class="d-flex justify-content-end" th:text="${status.getValue()}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="col-md-6 mx-auto">
                    <h3>By Employee Type</h3>

                    <div th:each="org : ${data.getEmployeeTypeStatusCounts()}">
                        <h4 th:text="${org.getKey()}"></h4>
                        <table>
                            <thead>
                            <tr>
                                <th>Status</th>
                                <th>Count</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="status : ${org.getValue()}">
                                <td th:text="${status.key}"></td>
                                <td class="d-flex justify-content-end" th:text="${status.getValue()}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="col-md-6 mx-auto">
                    <h3>By Location</h3>

                    <div th:each="org : ${data.getLocationStatusCounts()}">
                        <h4 th:text="${org.getKey()}"></h4>
                        <table>
                            <thead>
                            <tr>
                                <th>Status</th>
                                <th>Count</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="status : ${org.getValue()}">
                                <td th:text="${status.key}"></td>
                                <td class="d-flex justify-content-end" th:text="${status.getValue()}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <script th:inline="javascript">
                /*<![CDATA[*/
                var dataString = /*[[${totalLoginChartData}]]*/ {};
                var dataData = JSON.parse(dataString);

                var lineString = /*[[${loginByTimeChartData}]]*/ {};
                var lineData = JSON.parse(lineString);

                const ctx = document.getElementById('myChart');


                new Chart(ctx, {
                    type: 'pie',
                    data: dataData
                });


                const ctx2 = document.getElementById('myChart2');

                new Chart(ctx2, {
                    type: 'line',
                    data: lineData
                });

                /*]]>*/
            </script>
        </div>
    </div>
</div>
</body>
</html>
