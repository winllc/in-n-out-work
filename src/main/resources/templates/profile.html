<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div layout:fragment="content">


    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-center">
                <div>
                    <h3>Profile for <span th:text="${#authentication.name}"></span></h3>
                </div>
            </div>

            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>

            <!-- Display error message if present -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div class="alert alert-danger" role="alert">
                <span th:utext="#{profile.warning}"></span>
            </div>

            <form th:action="@{/app/profile}" method="post" th:object="${form}">
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <input type="text" class="form-control" id="notes" aria-describedby="notesHelp" th:field="*{notes}">
                    <div id="notesHelp" class="form-text">Add additional information about yourself</div>
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Status</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                    </select>

                    <div id="statusHelp" class="form-text">Current Status</div>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
