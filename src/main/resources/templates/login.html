<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; In-N-Out-Work</title>
    <link rel="stylesheet" th:href="@{/css/styles.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#f6f6f6;">
    <div class="card shadow-sm" style="width:100%;max-width:400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img th:src="@{/images/logos/in-n-out.svg}" alt="In-N-Out-Work"
                     style="max-width:140px;height:auto;" onerror="this.style.display='none'"/>
                <h4 class="mt-3 mb-1">Sign in</h4>
                <p class="text-muted small mb-0">Use your directory credentials</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                You have been signed out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="uid, name, or email" autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
