<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Record Table</title>
    <!-- Standalone page (not decorated by layout.html), so it pulls in Tabler itself. -->
    <link th:href="@{/libs/tabler/tabler.min.css}" rel="stylesheet">
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
</head>
<body>
<div class="page">
    <div class="page-body">
        <div class="container-xl">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Record Table</h3>
                </div>
                <div class="card-body">
                    <div id="record-table"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const table = new Tabulator("#record-table", {
        ajaxURL: "/api/check/records",
        ajaxParams: { page: 0, size: 10 },
        ajaxResponse: function(url, params, response) {
            // Tabulator expects array of row data
            return response.data;
        },
        pagination: "remote",
        paginationSize: 10,
        paginationDataSent: {
            "page": "page",
            "size": "size"
        },
        paginationDataReceived: {
            "last_page": "last_page"
        },
        columns: [
            { title: "ID", field: "id", width: 70 },
            { title: "DN", field: "dn" },
            { title: "Timestamp", field: "timestamp" },
            { title: "Action", field: "action" }
        ],
    });
</script>
</body>
</html>
