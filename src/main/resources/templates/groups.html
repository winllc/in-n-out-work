<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>

                </div>
            </div>
            <div class="col-md-4" th:if="${favoriteMap != null}">

                            <h3>Favorites</h3>
                        </div>

                        <table class="table mb-0 text-nowrap varient-table align-middle fs-3">
                            <tbody>
                                <tr th:each="entry : ${favoriteMap}">
                                    <td>
                                        <a th:href="@{'/app/users/'+ ${entry.key}}" th:text="${entry.value}"></a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

    </div>
