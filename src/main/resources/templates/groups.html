<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Groups</title>
</head>
<body>

<span layout:fragment="page-title">Groups</span>

<div layout:fragment="content">

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Group Hierarchy</h3>
            <div class="card-actions">
                <label class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="favorites-only">
                    <span class="form-check-label">Favorites only</span>
                </label>
            </div>
        </div>

        <div class="card-body border-bottom py-2">
            <div class="row g-2 align-items-center">
                <div class="col">
                    <div class="input-icon">
                        <span class="input-icon-addon">
                            <i class="ti ti-search"></i>
                        </span>
                        <input type="text" id="group-filter" class="form-control"
                               placeholder="Search groups..." autocomplete="off">
                    </div>
                </div>
                <div class="col-auto">
                    <div class="btn-list">
                        <button type="button" class="btn btn-sm" id="expand-all">Expand All</button>
                        <button type="button" class="btn btn-sm" id="collapse-all">Collapse All</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="list-group list-group-flush" id="group-tree">
            <!-- th:each sits on a wrapper: on one element th:replace would run first,
                 handing the fragment an unbound `group`. -->
            <th:block th:each="group : ${groups}">
                <div th:replace="~{fragments/grouptree :: groupNode(${group}, ${favoriteMap}, 0, ${initiallyExpanded})}"></div>
            </th:block>
        </div>

        <div class="card-body d-none" id="group-tree-empty">
            <div class="empty">
                <div class="empty-icon">
                    <i class="ti ti-search fs-1"></i>
                </div>
                <p class="empty-title">No matching groups</p>
                <p class="empty-subtitle text-secondary">Try a different search term.</p>
            </div>
        </div>

        <div class="card-body" th:if="${#lists.isEmpty(groups)}">
            <div class="empty">
                <div class="empty-icon">
                    <i class="ti ti-users fs-1"></i>
                </div>
                <p class="empty-title">No groups available</p>
                <p class="empty-subtitle text-secondary">
                    You do not have access to any groups yet.
                </p>
            </div>
        </div>
    </div>

<script>
    (function () {
        const tree = document.getElementById("group-tree");
        const filterInput = document.getElementById("group-filter");
        const favoritesOnly = document.getElementById("favorites-only");
        const noMatches = document.getElementById("group-tree-empty");

        const rootNodes = () => tree.querySelectorAll(":scope > .group-node");

        /*
         * A node stays visible when it matches, or when anything under it matches -
         * so ancestors of a hit are never hidden. Returns whether this subtree matched.
         */
        function applyFilter(node, query, favoritesOnlyMode) {
            const row = node.querySelector(":scope > .group-item");
            const children = node.querySelector(":scope > .group-children");

            let childMatched = false;
            if (children) {
                children.querySelectorAll(":scope > .group-node").forEach(child => {
                    childMatched = applyFilter(child, query, favoritesOnlyMode) || childMatched;
                });
            }

            const nameMatches = !query || row.dataset.groupName.includes(query);
            const favoriteMatches = !favoritesOnlyMode || row.dataset.favorite === "true";
            const selfMatched = nameMatches && favoriteMatches;

            node.classList.toggle("d-none", !(selfMatched || childMatched));

            // Reveal the path down to a match; restore normal behaviour once cleared.
            if (children && (query || favoritesOnlyMode) && childMatched) {
                children.classList.add("show");
                setToggleState(row, true);
            }

            return selfMatched || childMatched;
        }

        function setToggleState(row, expanded) {
            const toggle = row.querySelector(".group-toggle");
            if (toggle) {
                toggle.classList.toggle("collapsed", !expanded);
            }
        }

        function refresh() {
            const query = filterInput.value.trim().toLowerCase();
            const favoritesOnlyMode = favoritesOnly.checked;

            let anyVisible = false;
            rootNodes().forEach(node => {
                anyVisible = applyFilter(node, query, favoritesOnlyMode) || anyVisible;
            });

            noMatches.classList.toggle("d-none", anyVisible);
        }

        function setAll(expanded) {
            tree.querySelectorAll(".group-children").forEach(el => el.classList.toggle("show", expanded));
            tree.querySelectorAll(".group-item").forEach(row => setToggleState(row, expanded));
        }

        filterInput.addEventListener("input", refresh);
        favoritesOnly.addEventListener("change", refresh);
        document.getElementById("expand-all").addEventListener("click", () => setAll(true));
        document.getElementById("collapse-all").addEventListener("click", () => setAll(false));

        // Pin/unpin without leaving the page.
        tree.addEventListener("click", async (event) => {
            const button = event.target.closest(".favorite-toggle");
            if (!button) {
                return;
            }

            const row = button.closest(".group-item");
            const selected = row.dataset.favorite !== "true";

            const response = await fetch("/api/groups/favoriteGroup", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({groupDn: button.dataset.dn, selected: selected})
            });

            if (!response.ok) {
                showToast("Could not update favorite", {type: "danger"});
                return;
            }

            row.dataset.favorite = String(selected);
            const icon = button.querySelector("i");
            icon.classList.toggle("text-yellow", selected);
            icon.classList.toggle("text-secondary", !selected);

            showToast(selected ? "Group added to favorites" : "Group removed from favorites",
                {type: "success"});

            if (favoritesOnly.checked) {
                refresh();
            }
        });
    })();
</script>
</div>
</body>
</html>
