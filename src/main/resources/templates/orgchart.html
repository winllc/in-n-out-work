<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Tabulator + Spring Boot</title>
    <link th:href="@{/libs/tabulator/tabulator.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/libs/autoComplete/autoComplete.min.css}">
    <link rel="stylesheet"
          th:href="@{/libs/flatpickr/flatpickr.min.css}"/>

    <script th:src="@{/libs/flatpickr/flatpickr.min.js}"></script>
    <script th:src="@{/libs/tabulator/tabulator.min.js}"></script>
    <script th:src="@{/libs/fullcalendar/index.global.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/apextree"></script>
    <script th:src="@{/libs/autoComplete/autoComplete.min.js}"></script>

</head>
<body>
<div layout:fragment="content">



    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-center">
                <div>
                    <h3>Organization Chart</h3>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${message}" class="alert alert-success">
                <span th:text="${message}"></span>
            </div>

            <!-- Display error message if present -->
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>


            <div class="row">

                <div class="col-md-12">
                    <div id="svg-tree"></div>
                </div>

            </div>

        </div>
    </div>

    <!-- Popup showing the orgdetails content (member list) for the clicked node -->
    <div id="orgDetailsModal" class="modal fade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Organization Details for <span id="orgDetailsTitle"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-end mb-2">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="advanced-btn">
                            <label class="form-check-label" for="advanced-btn">Advanced</label>
                        </div>
                    </div>
                    <div id="modal-user-table"></div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript" type="module">
        async function getServerSideTreeData() {
            try {
                // 1. Fetch flat data from your API (e.g., Spring Boot or Node.js)
                const response = await fetch('/api/orgnodes/hierarchy', {
                    headers: {
                        'Accept': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // 2. Convert a flat list (id, name, parentId) into a hierarchical tree
                return await response.json();
            } catch (error) {
                console.error("Failed to load tree data from server:", error);
                return { id: "root", name: "Error Loading Data", children: [] };
            }
        }


        const depts = {
            hq: {bg: '#F8FAFC', border: '#94A3B8', borderHover: '#64748B', accent: '#475569'},
            finance: {bg: '#EFF6FF', border: '#93C5FD', borderHover: '#3B82F6', accent: '#2563EB'},
            hr: {bg: '#FDF2F8', border: '#F9A8D4', borderHover: '#EC4899', accent: '#DB2777'},
            marketing: {bg: '#FFF7ED', border: '#FDBA74', borderHover: '#F97316', accent: '#EA580C'},
            product: {bg: '#F0FDF4', border: '#86EFAC', borderHover: '#22C55E', accent: '#16A34A'},
            sales: {bg: '#EEF2FF', border: '#A5B4FC', borderHover: '#6366F1', accent: '#4F46E5'},
        };

        const makeOpts = (dept) => ({
            nodeBGColor: depts[dept].bg,
            nodeBGColorHover: depts[dept].bg,
            borderColor: depts[dept].border,
            borderColorHover: depts[dept].borderHover,
        });



        const data = await getServerSideTreeData();

        // Human-friendly names for raw employee-type codes. Add/adjust to match your directory's
        // values; any code not listed here is shown as-is.
        const employeeTypeLabels = {
            FT: 'Full-Time',
            PT: 'Part-Time',
            C: 'Contractor',
            CON: 'Contractor',
            TEMP: 'Temporary',
            INTERN: 'Intern',
            'N/A': 'Unspecified',
        };
        const typeLabel = (code) =>
            employeeTypeLabels[code] ?? employeeTypeLabels[String(code).toUpperCase()] ?? code;

        // Row labels for each employee-type breakdown. Rename freely once the exact
        // node-vs-total / full-tree semantics are confirmed.
        const memberLabels = {
            nodeMembersByEmployeeType: 'Members here',
            totalMembersByEmployeeType: 'Members (incl. sub-orgs)',
            fullTreeNodeMembersByEmployeeType: 'Members here (full tree)',
            fullTreeTotalMembersByEmployeeType: 'Members total (full tree)',
        };

        // Render a Map<String, Integer> (employeeType -> count) as a compact, readable list
        // with friendly type names and a per-line total.
        const fmtMap = (m) => {
            if (!m || Object.keys(m).length === 0) {
                return '<span style="color:#94A3B8;">&mdash;</span>';
            }
            const entries = Object.entries(m);
            const total = entries.reduce((sum, [, v]) => sum + (Number(v) || 0), 0);
            const parts = entries
                .map(([k, v]) => `<span style="white-space:nowrap;">${typeLabel(k)}: <strong>${v}</strong></span>`)
                .join(', ');
            return `${parts} <span style="color:#94A3B8;">(${total} total)</span>`;
        };

        const memberRow = (content, key) =>
            `<div><span style="color:#475569;font-weight:600;">${memberLabels[key]}:</span> ${fmtMap(content[key])}</div>`;

        const options = {
            //width: 700,
            //height: 700,
            nodeWidth: 240,
            nodeHeight: 190,
            childrenSpacing: 100,
            siblingSpacing: 40,
            direction: 'top',
            canvasStyle: 'border: 1px solid black; background: #f6f6f6;',
            contentKey: 'data',
            nodeTemplate: (content) => `
    <div class="org-node" data-orgname="${content.fullName ?? ''}" title="Click to view members"
         style="display:flex;flex-direction:column;gap:4px;padding:8px 10px;height:100%;overflow:auto;text-align:left;font-size:11px;line-height:1.3;cursor:pointer;">
      <div style="display:flex;flex-direction:column;">
        <span style="font-weight:600;font-size:13px;">${content.name ?? ''}</span>
        <span style="font-size:11px;color:#64748B;word-break:break-all;">${content.fullName ?? ''}</span>
      </div>
      ${memberRow(content, 'nodeMembersByEmployeeType')}
      ${memberRow(content, 'totalMembersByEmployeeType')}
      ${memberRow(content, 'fullTreeNodeMembersByEmployeeType')}
      ${memberRow(content, 'fullTreeTotalMembersByEmployeeType')}
      <div><span style="color:#475569;font-weight:600;">Present (full tree):</span>
        <strong>${content.fullTreePresentPercentage != null ? content.fullTreePresentPercentage.toFixed(1) : '0.0'}%</strong>
      </div>
    </div>
  `,

        };

        const tree = new ApexTree(document.getElementById('svg-tree'), options);
        tree.render(data);

        // ----- Org details popup (mirrors the orgdetails page content) -----

        let orgDetailsTable = null;
        const orgDetailsModalEl = document.getElementById('orgDetailsModal');

        // Tabulator renders at zero width inside a hidden modal; redraw once it's visible.
        orgDetailsModalEl.addEventListener('shown.bs.modal', () => {
            if (orgDetailsTable) {
                orgDetailsTable.redraw(true);
            }
        });

        // Exposed on window because this is a module script; the delegated listener below calls it.
        window.openOrgDetails = function (orgName) {
            if (!orgName) {
                return;
            }
            document.getElementById('orgDetailsTitle').textContent = orgName;

            if (orgDetailsTable) {
                orgDetailsTable.destroy();
                orgDetailsTable = null;
            }

            orgDetailsTable = new Tabulator("#modal-user-table", {
                ajaxURL: "/api/orgnodes/users/" + encodeURIComponent(orgName),
                ajaxResponse: (url, params, response) =>
                    Array.isArray(response) ? response : (response.data ?? []),
                pagination: "local",
                paginationSize: 10,
                layout: "fitDataStretch",
                layoutColumnsOnNewData: true,
                columns: [
                    {title: "Name", field: "cn", minWidth: 100, resizable: true, headerFilter: "input"},
                    {title: "DN", field: "dn", minWidth: 150, visible: false, resizable: true, headerFilter: "input"},
                    {title: "Status", field: "status", formatter: function (cell) {
                            let value = cell.getValue();
                            if (value === "IN") {
                                cell.getElement().style.color = "green";
                            } else if (value === "OUT") {
                                cell.getElement().style.color = "blue";
                            } else if (value === "AWAY") {
                                cell.getElement().style.color = "purple";
                            } else if (value === "NONE") {
                                cell.getElement().style.color = "gray";
                            }
                            return value;
                        }},
                    {title: "Checked In", field: "checkedInAt", visible: false, resizable: true},
                    {title: "Last Status Change", field: "lastStatusChangeAt", resizable: true},
                    {title: "Checked Out", field: "checkedOutAt", visible: false, resizable: true},
                    {title: "Notes", field: "notes", widthGrow: 3}
                ],
            });

            orgDetailsTable.on("rowClick", function (e, row) {
                window.location.href = `/app/user/details/${row.getData().dn}`;
            });

            bootstrap.Modal.getOrCreateInstance(orgDetailsModalEl).show();
        };

        // Advanced toggle inside the modal (same behavior as the orgdetails page).
        document.getElementById("advanced-btn").addEventListener("change", (event) => {
            if (!orgDetailsTable) {
                return;
            }
            if (event.target.checked) {
                orgDetailsTable.showColumn("checkedInAt");
                orgDetailsTable.showColumn("checkedOutAt");
                orgDetailsTable.showColumn("dn");
                orgDetailsTable.hideColumn("cn");
            } else {
                orgDetailsTable.hideColumn("checkedInAt");
                orgDetailsTable.hideColumn("checkedOutAt");
                orgDetailsTable.hideColumn("dn");
                orgDetailsTable.showColumn("cn");
            }
            orgDetailsTable.redraw(true);
        });

        // Delegated click: each node div carries data-orgname (empty for the synthetic root).
        document.addEventListener('click', (event) => {
            const nodeEl = event.target.closest('.org-node[data-orgname]');
            if (nodeEl && nodeEl.dataset.orgname) {
                window.openOrgDetails(nodeEl.dataset.orgname);
            }
        });
    </script>



</div>
</body>
</html>
