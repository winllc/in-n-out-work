# ReadyRoom - production deployment.
#
# Everything site-specific lives in .env (made from env.template by install.sh); this file should not
# need editing. Start, stop and inspect it from this directory, with Docker or Podman (./compose.sh
# runs whichever compose command install.sh chose):
#
#     ./compose.sh up -d          # docker compose up -d   /   podman-compose up -d
#     ./compose.sh ps
#     ./compose.sh logs -f app
#
# What comes up:
#   postgres   PostgreSQL 16 for ReadyRoom's own records (check-ins, roles, permissions, notes)
#   app        ReadyRoom on port 8181, published on the host as READYROOM_BIND_ADDRESS:READYROOM_PORT
#              (default 0.0.0.0:8181, every interface; 127.0.0.1 keeps it to this host, e.g. behind a
#              reverse proxy here). Keep the port at 1024 or above for rootless Podman.
#
# What does not: the LDAP directory / Active Directory and the SMTP server are the customer's own and
# are configured in .env. Optional pieces are separate files, switched on with COMPOSE_FILE in .env:
#   docker-compose.tls.yml           your own TLS keystore and client-certificate truststore (both required)
#   docker-compose.windows-auth.yml  Windows (Kerberos) sign-in: krb5.conf and the service keytab
#
# The project name is fixed, so the named volumes (the database, the license with this installation's
# id, and the audit log file) are the same ones whichever directory a release is unpacked into; upgrade.sh
# relies on this. Never "docker compose down -v": it deletes them.
#
# Valid for Docker Compose 2.24 or later and podman-compose 1.3 or later: images are fully qualified (Podman has no
# default registry) and the optional files' bind mounts carry :Z for SELinux hosts.

name: readyroom

services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-readyroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-readyroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host: only the application reaches it, over the backend network.
    networks:
      - backend

  app:
    image: __READYROOM_IMAGE__
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every variable in .env reaches the application, so any setting in the README's Configuration
    # section can be added there as an environment variable without touching this file. That includes
    # every ENS_AUDIT_* audit logging variable (see env.template).
    env_file:
      - path: .env
        required: true
    volumes:
      # The ENS Solutions license and licensing state (the installation id licenses are bound to), kept
      # across upgrades like the database. install.sh/upgrade.sh copy license/license.lic in when it
      # holds none; otherwise upload licenses on the license screen (/app/admin/license).
      - ens-license:/var/lib/ens/readyroom
      # The audit log file, when ENS_AUDIT_FILE is set (/var/log/ens/readyroom/audit.jsonl), kept across
      # upgrades for a forwarder to read. Unused otherwise.
      - ens-audit:/var/log/ens
    ports:
      - "${READYROOM_BIND_ADDRESS:-0.0.0.0}:${READYROOM_PORT:-8181}:8181"
    healthcheck:
      # /actuator/health includes the mail server: see MANAGEMENT_HEALTH_MAIL_ENABLED in .env.
      # Plain HTTP unless SSL_ENABLED=true, when the same port speaks TLS - hence the second try. With
      # MANAGEMENT_SERVER_PORT set in .env, actuator is on that port instead, always plain HTTP.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${MANAGEMENT_SERVER_PORT:-$${SERVER_PORT:-8181}}/actuator/health || curl -kfsS -o /dev/null https://127.0.0.1:$${SERVER_PORT:-8181}/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  ens-license:
  ens-audit:
