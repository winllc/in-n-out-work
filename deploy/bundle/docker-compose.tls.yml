# TLS with your own keystore and truststore. Switch it on in .env:
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
#     SSL_ENABLED=true
#     SERVER_SSL_KEYSTOREPASSWORD=...
#     SERVER_SSL_TRUSTSTOREPASSWORD=...
#
# Put both files in ./tls before starting; both are required:
#   tls/keystore.p12     PKCS#12 with the server's private key and certificate chain
#   tls/truststore.p12   PKCS#12 with only the CA certificates whose client certificates may sign in
#                        (X.509 sign-in, used by the Windows client)
#
# The image contains no keystore or truststore. With SSL_ENABLED=true and either one missing,
# ReadyRoom refuses to start (and install.sh / upgrade.sh stop before starting it).
# The container runs as user 185, group 0: make the files readable by group 0 (chgrp 0, chmod 0640).

services:
  app:
    environment:
      SERVER_SSL_KEYSTORE: file:/etc/in-n-out/tls/keystore.p12
      SERVER_SSL_KEYSTORETYPE: PKCS12
      SERVER_SSL_TRUSTSTORE: file:/etc/in-n-out/tls/truststore.p12
      SERVER_SSL_TRUSTSTORETYPE: PKCS12
    volumes:
      - ./tls:/etc/in-n-out/tls:ro
