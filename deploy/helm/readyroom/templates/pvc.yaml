{{- $p := .Values.persistence.license -}}
{{- if and $p.enabled (not $p.existingClaim) }}
# An earlier release's license state, imported into the database on the first start of this one (see
# persistence.license in values.yaml). Kept when it leaves the release (persistence.license.enabled=false,
# helm uninstall) and never pruned by Argo CD: losing it before the import would lose the installation id.
# Delete it yourself once ReadyRoom has started with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "readyroom.licenseClaimName" . }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: license
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  {{- with $p.storageClass }}
  storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- $a := .Values.audit.file -}}
{{- if and $a.enabled $a.persistence.enabled (not $a.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "readyroom.fullname" . }}-audit
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit
spec:
  accessModes:
    {{- toYaml $a.persistence.accessModes | nindent 4 }}
  {{- with $a.persistence.storageClass }}
  storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ $a.persistence.size }}
{{- end }}
