{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "readyroom.serviceAccountName" . }}
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# ReadyRoom does not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
