{{- $v := .Values -}}
{{- $data := dict -}}
{{- if and $v.database.password (not $v.database.existingSecret) -}}
{{- $_ := set $data "db-password" $v.database.password -}}
{{- else if and $v.database.embedded.enabled (not $v.database.existingSecret) -}}
{{- /* The embedded database's password, generated once and kept across upgrades. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "readyroom.fullname" .) -}}
{{- if and $existing $existing.data (hasKey $existing.data "db-password") -}}
{{- $_ := set $data "db-password" (index $existing.data "db-password" | b64dec) -}}
{{- else -}}
{{- $_ := set $data "db-password" (randAlphaNum 32) -}}
{{- end -}}
{{- end -}}
{{- if and $v.database.migration.username $v.database.migration.password (not $v.database.migration.existingSecret) -}}
{{- $_ := set $data "migration-password" $v.database.migration.password -}}
{{- end -}}
{{- if and (eq $v.x509.source "header") $v.x509.proxySecret.value (not $v.x509.proxySecret.existingSecret) -}}
{{- $_ := set $data "x509-proxy-secret" $v.x509.proxySecret.value -}}
{{- end -}}
{{- if and $v.x509.trustedCa.value (not $v.x509.trustedCa.existingSecret) -}}
{{- $_ := set $data "x509-ca.pem" $v.x509.trustedCa.value -}}
{{- end -}}
{{- if and $v.sso.oidc.enabled $v.sso.oidc.clientSecret (not $v.sso.oidc.existingSecret) -}}
{{- $_ := set $data "oidc-client-secret" $v.sso.oidc.clientSecret -}}
{{- end -}}
{{- if and $v.ldap.bindPassword (not $v.ldap.existingSecret) -}}
{{- $_ := set $data "ldap-password" $v.ldap.bindPassword -}}
{{- end -}}
{{- if and $v.smtp.password (not $v.smtp.existingSecret) -}}
{{- $_ := set $data "smtp-password" $v.smtp.password -}}
{{- end -}}
{{- if and $v.audit.splunk.token (not $v.audit.splunk.existingSecret) -}}
{{- $_ := set $data "splunk-token" $v.audit.splunk.token -}}
{{- end -}}
{{- if and $v.tls.keystore.password (not $v.tls.keystore.existingSecret) -}}
{{- $_ := set $data "keystore-password" $v.tls.keystore.password -}}
{{- end -}}
{{- if and $v.tls.truststore.password (not $v.tls.truststore.existingSecret) -}}
{{- $_ := set $data "truststore-password" $v.tls.truststore.password -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "readyroom.fullname" . }}
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $val := $data }}
  {{ $k }}: {{ $val | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and $v.license.file (not $v.license.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "readyroom.fullname" . }}-license
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
type: Opaque
data:
  license.lic: {{ $v.license.file | b64enc | quote }}
{{- end }}
