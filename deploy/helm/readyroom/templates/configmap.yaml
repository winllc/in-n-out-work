{{- $v := .Values -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "readyroom.fullname" . }}
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
data:
  # Non-secret settings, as ReadyRoom's environment (the release bundle's env.template).
  JAVA_OPTS: {{ $v.javaOpts | quote }}
  # The license directory, exactly as the image sets it; the license PVC is mounted at /var/lib/ens.
  ENS_LICENSE_STATE_DIR: /var/lib/ens/readyroom
  ENS_LICENSE_FILE: /var/lib/ens/readyroom/license.lic
  # The Kubernetes probes use /actuator/health/liveness and /readiness.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  {{- if include "readyroom.edgeTls" . }}
  # TLS ends at the ingress or route: take the scheme and client address from its X-Forwarded-* headers
  # (secure requests, HSTS, redirects) and always mark the session cookie Secure.
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  ENS_COOKIE_SECURE: "true"
  {{- end }}
  {{- with $v.csp.reportOnly }}
  ENS_CSP_REPORT_ONLY: "true"
  {{- end }}

  # Notice-and-consent banner and session lifetimes
  ENS_CONSENT_BANNER_ENABLED: {{ $v.consentBanner.enabled | quote }}
  {{- with $v.consentBanner.title }}
  ENS_CONSENT_BANNER_TITLE: {{ . | quote }}
  {{- end }}
  {{- with $v.consentBanner.text }}
  ENS_CONSENT_BANNER_TEXT: {{ . | quote }}
  {{- end }}
  {{- if $v.consentBanner.existingConfigMap }}
  ENS_CONSENT_BANNER_FILE: /etc/in-n-out/consent/banner.txt
  {{- end }}
  ENS_SESSION_IDLE_TIMEOUT: {{ $v.session.idleTimeout | quote }}
  {{- with $v.session.adminIdleTimeout }}
  ENS_SESSION_ADMIN_IDLE_TIMEOUT: {{ . | quote }}
  {{- end }}
  ENS_SESSION_ABSOLUTE_TIMEOUT: {{ $v.session.absoluteTimeout | quote }}
  ENS_SESSION_MAX_PER_USER: {{ $v.session.maxPerUser | quote }}
  {{- with include "readyroom.publicUrl" . }}
  APPLICATION_BASE_URL: {{ . | quote }}
  {{- end }}

  # Status requests, coworker visibility and retention
  APPLICATION_EVENTS_MAXRANGEDAYS: {{ $v.events.maxRangeDays | quote }}
  {{- with $v.events.requestStatuses }}
  APPLICATION_EVENTS_REQUESTSTATUSES: {{ join "," . | quote }}
  {{- end }}
  APPLICATION_PRIVACY_COWORKERVISIBILITY: {{ $v.privacy.coworkerVisibility | quote }}
  APPLICATION_RETENTION_EVENTSDAYS: {{ $v.retention.eventsDays | quote }}
  APPLICATION_RETENTION_CRON: {{ $v.retention.schedule | quote }}

  # Database
  DB_HOST: {{ include "readyroom.dbHost" . | quote }}
  DB_PORT: {{ $v.database.port | quote }}
  DB_NAME: {{ $v.database.name | quote }}
  DB_USERNAME: {{ $v.database.username | quote }}
  {{- with $v.database.migration.username }}
  # Flyway migrates the schema at startup as this account (it owns the schema); DB_USERNAME then only
  # reads and writes rows.
  SPRING_FLYWAY_USER: {{ . | quote }}
  {{- end }}

  # Directory
  {{- if $v.ldap.url }}
  SPRING_LDAP_URLS: {{ $v.ldap.url | quote }}
  {{- else if $v.ldap.host }}
  SPRING_LDAP_URLS: {{ printf "%s://%s:%s" $v.ldap.scheme $v.ldap.host (include "readyroom.ldapPort" .) | quote }}
  {{- end }}
  {{- with $v.ldap.bindDn }}
  LDAP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with $v.ldap.userBaseDn }}
  APPLICATION_USERBASEDN: {{ . | quote }}
  {{- end }}
  {{- with $v.ldap.userFilter }}
  APPLICATION_USERLDAPFILTER: {{ . | quote }}
  {{- end }}
  {{- range $i, $dn := $v.ldap.groupBaseDns }}
  APPLICATION_GROUPS_{{ $i }}_GROUPSBASEDN: {{ $dn | quote }}
  {{- end }}
  {{- range $i, $dn := $v.superUserDns }}
  APPLICATION_SUPERUSERDNS_{{ $i }}: {{ $dn | quote }}
  {{- end }}
  APPLICATION_DUTYSUBORGGROUPSBASEDN: {{ $v.orgChart.groupsBaseDn | quote }}
  {{- with $v.ldap.attributes }}
  {{- with .organization }}
  APPLICATION_USERLDAPORGANIZATIONATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with .location }}
  APPLICATION_USERLDAPLOCATIONATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with .employeeType }}
  APPLICATION_USERLDAPEMPLOYEETYPEATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with .managerId }}
  APPLICATION_USERLDAPMANAGERIDATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with .managerLdapId }}
  APPLICATION_MANAGERLDAPIDATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- with .dutySubOrganization }}
  APPLICATION_USERLDAPDUTYSUBORGANIZATIONATTRIBUTE: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Mail
  {{- with $v.smtp.host }}
  SPRING_MAIL_HOST: {{ . | quote }}
  {{- end }}
  SPRING_MAIL_PORT: {{ $v.smtp.port | quote }}
  {{- with $v.smtp.username }}
  SPRING_MAIL_USERNAME: {{ . | quote }}
  {{- end }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: {{ $v.smtp.auth | quote }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: {{ $v.smtp.starttls | quote }}
  {{- with $v.smtp.sslTrust }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST: {{ . | quote }}
  {{- end }}
  {{- with $v.smtp.from }}
  APPLICATION_NOTIFICATIONSENDEREMAIL: {{ . | quote }}
  {{- end }}
  MANAGEMENT_HEALTH_MAIL_ENABLED: {{ $v.smtp.healthCheck | quote }}

  # TLS
  SSL_ENABLED: {{ $v.tls.enabled | quote }}
  {{- if $v.tls.enabled }}
  SERVER_SSL_CLIENTAUTH: {{ $v.tls.clientAuth | quote }}
  SERVER_SSL_KEYSTORE: file:/etc/in-n-out/tls/keystore/{{ $v.tls.keystore.secretKey }}
  SERVER_SSL_KEYSTORETYPE: {{ $v.tls.keystore.type | quote }}
  {{- if $v.tls.truststore.secretName }}
  SERVER_SSL_TRUSTSTORE: file:/etc/in-n-out/tls/truststore/{{ $v.tls.truststore.secretKey }}
  SERVER_SSL_TRUSTSTORETYPE: {{ $v.tls.truststore.type | quote }}
  {{- end }}
  {{- end }}

  # Client certificates (X.509)
  ENS_X509_SOURCE: {{ $v.x509.source | quote }}
  {{- if eq $v.x509.source "header" }}
  {{- with $v.x509.header }}
  ENS_X509_HEADER: {{ . | quote }}
  {{- end }}
  ENS_X509_TRUSTED_PROXIES: {{ $v.x509.trustedProxies | quote }}
  ENS_X509_PROXY_SECRET_FILE: /etc/in-n-out/x509/proxy-secret
  {{- end }}
  {{- if or $v.x509.trustedCa.value $v.x509.trustedCa.existingSecret }}
  ENS_X509_TRUSTED_CA_FILE: /etc/in-n-out/x509/ca.pem
  {{- end }}
  {{- with $v.x509.userFilter }}
  ENS_X509_USER_FILTER: {{ . | quote }}
  {{- end }}
  {{- with $v.x509.allowedIssuers }}
  ENS_X509_ALLOWED_ISSUERS: {{ . | quote }}
  {{- end }}
  ENS_X509_REVOCATION: {{ $v.x509.revocation.mode | quote }}
  {{- with $v.x509.revocation.ocspResponderUrl }}
  ENS_X509_OCSP_RESPONDER_URL: {{ . | quote }}
  {{- end }}
  {{- if $v.x509.revocation.crlConfigMap }}
  ENS_X509_CRL_DIR: /etc/in-n-out/crl
  {{- end }}
  ENS_X509_REVOCATION_FAIL: {{ $v.x509.revocation.fail | quote }}
  ENS_X509_REVOCATION_CACHE: {{ $v.x509.revocation.cache | quote }}

  # Windows (Kerberos) sign-in
  APPLICATION_WINDOWSAUTH_ENABLED: {{ $v.windowsAuth.enabled | quote }}
  {{- if $v.windowsAuth.enabled }}
  APPLICATION_WINDOWSAUTH_SERVICEPRINCIPAL: {{ required "windowsAuth.servicePrincipal is required when windowsAuth.enabled (HTTP/<host>@REALM)" $v.windowsAuth.servicePrincipal | quote }}
  APPLICATION_WINDOWSAUTH_KEYTABLOCATION: /etc/in-n-out/http.keytab
  APPLICATION_WINDOWSAUTH_ACCOUNTATTRIBUTE: {{ $v.windowsAuth.accountAttribute | quote }}
  APPLICATION_WINDOWSAUTH_STRIPREALM: {{ $v.windowsAuth.stripRealm | quote }}
  {{- with $v.windowsAuth.allowedRealms }}
  APPLICATION_WINDOWSAUTH_ALLOWEDREALMS: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Audit logging (ens-audit/1)
  ENS_AUDIT_STDOUT: {{ $v.audit.stdout | quote }}
  {{- if $v.audit.file.enabled }}
  ENS_AUDIT_FILE: {{ $v.audit.file.path | quote }}
  ENS_AUDIT_FILE_KEEP: {{ $v.audit.file.keep | quote }}
  {{- end }}
  ENS_AUDIT_RETENTION_DAYS: {{ $v.audit.retentionDays | quote }}
  {{- with $v.audit.splunk }}
  {{- if .url }}
  ENS_AUDIT_SPLUNK_URL: {{ .url | quote }}
  {{- with .index }}
  ENS_AUDIT_SPLUNK_INDEX: {{ . | quote }}
  {{- end }}
  ENS_AUDIT_SPLUNK_SOURCETYPE: {{ .sourcetype | quote }}
  ENS_AUDIT_SPLUNK_INSECURE: {{ .insecure | quote }}
  {{- end }}
  {{- end }}
  {{- with $v.audit.syslog }}
  {{- if .host }}
  ENS_AUDIT_SYSLOG_HOST: {{ .host | quote }}
  {{- with .port }}
  ENS_AUDIT_SYSLOG_PORT: {{ . | quote }}
  {{- end }}
  ENS_AUDIT_SYSLOG_PROTOCOL: {{ .protocol | quote }}
  ENS_AUDIT_SYSLOG_FACILITY: {{ .facility | quote }}
  {{- end }}
  {{- end }}

  # Other
  APPLICATION_BANNERTEXT: {{ $v.bannerText | quote }}
  SPRING_JACKSON_TIMEZONE: {{ $v.timezone | quote }}
  APPLICATION_TIMEZONE: {{ $v.timezone | quote }}
  APPLICATION_CHECKOUTAFTERMINUTES: {{ $v.checkOutAfterMinutes | quote }}
  {{- with $v.updateProfileUrl }}
  APPLICATION_UPDATEPROFILEURL: {{ . | quote }}
  {{- end }}
  LOGGING_LEVEL_COM_WINLLC_INNOUTWORK: {{ $v.logLevel | quote }}
  {{- if eq $v.logFormat "json" }}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  {{- end }}
  {{- if $v.metrics.enabled }}
  # Actuator (probes and /actuator/prometheus) on its own plain-HTTP port, open without sign-in.
  MANAGEMENT_SERVER_PORT: {{ $v.metrics.port | quote }}
  {{- end }}
{{- if and $v.windowsAuth.enabled $v.windowsAuth.krb5Conf (not $v.windowsAuth.krb5ConfExistingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "readyroom.fullname" . }}-krb5
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
data:
  krb5.conf: |
    {{- $v.windowsAuth.krb5Conf | nindent 4 }}
{{- end }}
