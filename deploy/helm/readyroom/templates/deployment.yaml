{{- $v := .Values -}}
{{- include "readyroom.validate" . -}}
{{- $licenseSecret := include "readyroom.licenseSecretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "readyroom.fullname" . }}
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  revisionHistoryLimit: {{ $v.revisionHistoryLimit }}
  strategy:
    {{- include "readyroom.strategy" . | nindent 4 }}
  selector:
    matchLabels:
      {{- include "readyroom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "readyroom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "readyroom.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "readyroom.podSecurityContext" (dict "ctx" $v.podSecurityContext "root" .) | nindent 8 }}
      {{- if and $licenseSecret $v.persistence.license.enabled }}
      initContainers:
        # Copies the supplied license into the license volume only when none is installed there, as the
        # release bundle's install.sh does: a license uploaded later on the license screen is never
        # overwritten by an upgrade.
        - name: license-init
          image: {{ include "readyroom.image" (dict "image" $v.licenseInit.image "root" . "tag" "1.36.1") }}
          imagePullPolicy: {{ $v.licenseInit.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              dir=/var/lib/ens/readyroom
              target="$dir/license.lic"
              src=/license-src/license.lic
              mkdir -p "$dir"
              if [ -s "$target" ]; then
                echo "A license is already installed in the license volume; leaving it. Replace it on the license screen (/app/admin/license)."
              elif ! grep -q -- '-----BEGIN ENS LICENSE-----' "$src"; then
                echo "The supplied license is not an ENS license (ens-license/1); not copied. Download it again from the ENS portal."
              else
                umask 007
                cp "$src" "$target.tmp"
                mv "$target.tmp" "$target"
                echo "Copied the supplied license into the license volume."
              fi
          securityContext:
            {{- include "readyroom.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: license
              mountPath: /var/lib/ens
            - name: license-src
              mountPath: /license-src
              readOnly: true
      {{- end }}
      containers:
        - name: readyroom
          image: {{ include "readyroom.appImage" . }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: {{ include "readyroom.portName" . }}
              containerPort: 8181
              protocol: TCP
            {{- if $v.metrics.enabled }}
            - name: metrics
              containerPort: {{ $v.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "readyroom.fullname" . }}
            {{- with $v.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "readyroom.dbPasswordRef" . | nindent 18 }}
            {{- if $v.database.migration.username }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "SPRING_FLYWAY_PASSWORD" "value" $v.database.migration.password "existingSecret" $v.database.migration.existingSecret "existingSecretKey" $v.database.migration.existingSecretKey "key" "migration-password") }}{{ . | nindent 12 }}{{ end }}
            {{- end }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "LDAP_PASSWORD" "value" $v.ldap.bindPassword "existingSecret" $v.ldap.existingSecret "existingSecretKey" $v.ldap.existingSecretKey "key" "ldap-password") }}{{ . | nindent 12 }}{{ end }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "SPRING_MAIL_PASSWORD" "value" $v.smtp.password "existingSecret" $v.smtp.existingSecret "existingSecretKey" $v.smtp.existingSecretKey "key" "smtp-password") }}{{ . | nindent 12 }}{{ end }}
            {{- if $v.sso.oidc.enabled }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "ENS_SSO_OIDC_CLIENT_SECRET" "value" $v.sso.oidc.clientSecret "existingSecret" $v.sso.oidc.existingSecret "existingSecretKey" $v.sso.oidc.existingSecretKey "key" "oidc-client-secret") }}{{ . | nindent 12 }}{{ end }}
            {{- end }}
            {{- if $v.audit.splunk.url }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "ENS_AUDIT_SPLUNK_TOKEN" "value" $v.audit.splunk.token "existingSecret" $v.audit.splunk.existingSecret "existingSecretKey" $v.audit.splunk.existingSecretKey "key" "splunk-token") }}{{ . | nindent 12 }}{{ end }}
            {{- end }}
            {{- if $v.tls.enabled }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "SERVER_SSL_KEYSTOREPASSWORD" "value" $v.tls.keystore.password "existingSecret" $v.tls.keystore.existingSecret "existingSecretKey" $v.tls.keystore.existingSecretKey "key" "keystore-password") }}{{ . | nindent 12 }}{{ end }}
            {{- if $v.tls.truststore.secretName }}
            {{- with include "readyroom.secretEnv" (dict "root" . "env" "SERVER_SSL_TRUSTSTOREPASSWORD" "value" $v.tls.truststore.password "existingSecret" $v.tls.truststore.existingSecret "existingSecretKey" $v.tls.truststore.existingSecretKey "key" "truststore-password") }}{{ . | nindent 12 }}{{ end }}
            {{- end }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if gt (int $v.preStopSleepSeconds) 0 }}
          lifecycle:
            # Out of the Service's endpoints before the server stops accepting, so no check-in is refused.
            preStop:
              exec:
                command: ["sleep", "{{ $v.preStopSleepSeconds }}"]
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ include "readyroom.probePort" . }}
              scheme: {{ include "readyroom.probeScheme" . }}
            {{- toYaml $v.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ include "readyroom.probePort" . }}
              scheme: {{ include "readyroom.probeScheme" . }}
            {{- toYaml $v.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ include "readyroom.probePort" . }}
              scheme: {{ include "readyroom.probeScheme" . }}
            {{- toYaml $v.probes.readiness | nindent 12 }}
          securityContext:
            {{- include "readyroom.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
            - name: license
              mountPath: /var/lib/ens
            {{- if $v.tls.enabled }}
            - name: keystore
              mountPath: /etc/in-n-out/tls/keystore
              readOnly: true
            {{- if $v.tls.truststore.secretName }}
            - name: truststore
              mountPath: /etc/in-n-out/tls/truststore
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $v.windowsAuth.enabled }}
            - name: keytab
              mountPath: /etc/in-n-out/http.keytab
              subPath: http.keytab
              readOnly: true
            {{- if or $v.windowsAuth.krb5Conf $v.windowsAuth.krb5ConfExistingConfigMap }}
            - name: krb5
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $v.audit.file.enabled }}
            - name: audit
              mountPath: {{ dir $v.audit.file.path }}
            {{- end }}
            {{- if or (eq $v.x509.source "header") $v.x509.trustedCa.value $v.x509.trustedCa.existingSecret }}
            - name: x509
              mountPath: /etc/in-n-out/x509
              readOnly: true
            {{- end }}
            {{- if and $v.sso.saml.enabled $v.sso.saml.metadataConfigMap }}
            - name: saml-idp
              mountPath: /etc/in-n-out/saml-idp
              readOnly: true
            {{- end }}
            {{- if and $v.sso.saml.enabled $v.sso.saml.spKeySecret }}
            - name: saml-sp
              mountPath: /etc/in-n-out/saml-sp
              readOnly: true
            {{- end }}
            {{- if $v.x509.revocation.crlConfigMap }}
            - name: crl
              mountPath: /etc/in-n-out/crl
              readOnly: true
            {{- end }}
            {{- if $v.consentBanner.existingConfigMap }}
            - name: consent
              mountPath: /etc/in-n-out/consent
              readOnly: true
            {{- end }}
            {{- with $v.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-tmp
          emptyDir: {}
        - name: license
          {{- if $v.persistence.license.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "readyroom.licenseClaimName" . }}
          {{- else }}
          # Not persistent: the license and installation id are lost with the pod. Testing only.
          emptyDir: {}
          {{- end }}
        {{- if and $licenseSecret $v.persistence.license.enabled }}
        - name: license-src
          secret:
            secretName: {{ $licenseSecret }}
            items:
              - key: license.lic
                path: license.lic
        {{- end }}
        {{- if $v.tls.enabled }}
        - name: keystore
          secret:
            secretName: {{ $v.tls.keystore.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $v.tls.keystore.secretKey }}
                path: {{ $v.tls.keystore.secretKey }}
        {{- if $v.tls.truststore.secretName }}
        - name: truststore
          secret:
            secretName: {{ $v.tls.truststore.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $v.tls.truststore.secretKey }}
                path: {{ $v.tls.truststore.secretKey }}
        {{- end }}
        {{- end }}
        {{- if $v.windowsAuth.enabled }}
        - name: keytab
          secret:
            secretName: {{ $v.windowsAuth.keytab.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $v.windowsAuth.keytab.secretKey }}
                path: http.keytab
        {{- if or $v.windowsAuth.krb5Conf $v.windowsAuth.krb5ConfExistingConfigMap }}
        - name: krb5
          configMap:
            name: {{ default (printf "%s-krb5" (include "readyroom.fullname" .)) $v.windowsAuth.krb5ConfExistingConfigMap }}
            items:
              - key: {{ ternary $v.windowsAuth.krb5ConfExistingConfigMapKey "krb5.conf" (not (empty $v.windowsAuth.krb5ConfExistingConfigMap)) }}
                path: krb5.conf
        {{- end }}
        {{- end }}
        {{- if $v.audit.file.enabled }}
        - name: audit
          {{- if $v.audit.file.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-audit" (include "readyroom.fullname" .)) $v.audit.file.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if or (eq $v.x509.source "header") $v.x509.trustedCa.value $v.x509.trustedCa.existingSecret }}
        # The proxy secret and the CAs of user certificates, as files.
        - name: x509
          projected:
            defaultMode: 0440
            sources:
              {{- if eq $v.x509.source "header" }}
              - secret:
                  name: {{ $v.x509.proxySecret.existingSecret | default (include "readyroom.fullname" .) }}
                  items:
                    - key: {{ ternary $v.x509.proxySecret.existingSecretKey "x509-proxy-secret" (not (empty $v.x509.proxySecret.existingSecret)) }}
                      path: proxy-secret
              {{- end }}
              {{- if or $v.x509.trustedCa.value $v.x509.trustedCa.existingSecret }}
              - secret:
                  name: {{ $v.x509.trustedCa.existingSecret | default (include "readyroom.fullname" .) }}
                  items:
                    - key: {{ ternary $v.x509.trustedCa.existingSecretKey "x509-ca.pem" (not (empty $v.x509.trustedCa.existingSecret)) }}
                      path: ca.pem
              {{- end }}
        {{- end }}
        {{- if and $v.sso.saml.enabled $v.sso.saml.metadataConfigMap }}
        - name: saml-idp
          configMap:
            name: {{ $v.sso.saml.metadataConfigMap }}
            items:
              - key: {{ $v.sso.saml.metadataConfigMapKey }}
                path: metadata.xml
        {{- end }}
        {{- if and $v.sso.saml.enabled $v.sso.saml.spKeySecret }}
        - name: saml-sp
          secret:
            secretName: {{ $v.sso.saml.spKeySecret }}
            defaultMode: 0440
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
        {{- end }}
        {{- if $v.x509.revocation.crlConfigMap }}
        - name: crl
          configMap:
            name: {{ $v.x509.revocation.crlConfigMap }}
        {{- end }}
        {{- if $v.consentBanner.existingConfigMap }}
        - name: consent
          configMap:
            name: {{ $v.consentBanner.existingConfigMap }}
            items:
              - key: {{ $v.consentBanner.existingConfigMapKey }}
                path: banner.txt
        {{- end }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $v.affinity }}
      affinity:
        {{- toYaml $v.affinity | nindent 8 }}
      {{- else if gt (int $v.replicaCount) 1 }}
      affinity:
        # Replicas on different nodes when there is room, so losing a node does not take them all.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "readyroom.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: app
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
