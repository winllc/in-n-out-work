{{- $m := .Values.metrics -}}
{{- if and $m.enabled $m.serviceMonitor.enabled -}}
# Prometheus Operator: scrape /actuator/prometheus on the Service's metrics port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "readyroom.fullname" . }}
  labels:
    {{- include "readyroom.labels" . | nindent 4 }}
    {{- with $m.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "readyroom.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      scheme: http
      interval: {{ $m.serviceMonitor.interval }}
      {{- with $m.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
