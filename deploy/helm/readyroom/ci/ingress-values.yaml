# Browsers and the Windows client through ingress-nginx with TLS at the ingress (edge): password sign-in,
# and client certificates verified by the ingress and forwarded in a header (x509.source header) with the
# proxy secret; revocation by OCSP, then CRL; CAC certificates mapped to AD users by UPN. Coworkers see only
# in or out, records are kept for 13 months, and only leave and excused absence need approval.
database:
  host: postgres.example.internal
  password: example-db-password
ldap:
  url: ldaps://ldap.example.internal:636
  bindDn: CN=readyroom-svc,OU=Service Accounts,DC=example,DC=com
  bindPassword: example-ldap-password
  userBaseDn: DC=example,DC=com
  userFilter: (&(objectCategory=person)(objectClass=user))
  groupBaseDns:
    - OU=Groups,DC=example,DC=com
    - OU=Departments,DC=example,DC=com
superUserDns:
  - CN=Jane Admin,OU=Users,DC=example,DC=com
events:
  requestStatuses:
    - SCHEDULED_LEAVE
    - ABSENT_EXCUSED
privacy:
  coworkerVisibility: status
retention:
  eventsDays: 400
orgChart:
  groupsBaseDn: OU=Groups,DC=example,DC=com
smtp:
  host: smtp.example.internal
  username: readyroom
  password: example-smtp-password
  from: readyroom@example.com
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/auth-tls-secret: readyroom/readyroom-user-cas
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-ENS-Proxy-Secret "example-proxy-secret-0123456789abcdef";
  hosts:
    - host: readyroom.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: readyroom-ingress-tls
      hosts: [readyroom.example.com]
consentBanner:
  enabled: true
session:
  adminIdleTimeout: 15m
  maxPerUser: 3
x509:
  source: header
  header: ssl-client-cert
  proxySecret:
    value: example-proxy-secret-0123456789abcdef
  trustedCa:
    value: |
      -----BEGIN CERTIFICATE-----
      example
      -----END CERTIFICATE-----
  userFilter: (userPrincipalName={upn})
  allowedIssuers: CN=DOD ID CA-59,OU=PKI,OU=DoD,O=U.S. Government,C=US;CN=DOD ID CA-62,OU=PKI,OU=DoD,O=U.S. Government,C=US
  revocation:
    mode: ocsp-then-crl
    ocspResponderUrl: http://ocsp.example.internal
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    cidrs: [10.0.0.0/8]
audit:
  splunk:
    url: https://splunk.example.internal:8088
    token: example-hec-token
    index: ens
  syslog:
    host: syslog.example.internal
    protocol: udp
