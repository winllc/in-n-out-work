# OpenID Connect (Entra ID) and SAML (IdP metadata from a ConfigMap, a signing key from a Secret).
database:
  host: postgres.example.internal
  password: example-db-password
ldap:
  host: ldap.example.internal
  bindDn: CN=readyroom-svc,OU=Service Accounts,DC=example,DC=com
  bindPassword: example-ldap-password
  userBaseDn: DC=example,DC=com
superUserDns:
  - CN=Jane Admin,OU=Users,DC=example,DC=com
publicUrl: https://readyroom.example.com
sso:
  roleMapping: "6f1c2c3e-0000-4000-8000-000000000001=ADMIN;6f1c2c3e-0000-4000-8000-000000000002=MANAGER"
  oidc:
    enabled: true
    issuerUri: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
    clientId: 11111111-1111-1111-1111-111111111111
    existingSecret: readyroom-oidc
    existingSecretKey: client-secret
    userFilter: "(userPrincipalName={preferred_username})"
  saml:
    enabled: true
    metadataConfigMap: readyroom-idp-metadata
    userFilter: "(userPrincipalName={http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn})"
    spKeySecret: readyroom-saml-sp
