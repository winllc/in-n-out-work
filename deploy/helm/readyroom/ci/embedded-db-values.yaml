# Evaluation: the embedded PostgreSQL (no backups) and a license from a file.
database:
  embedded:
    enabled: true
ldap:
  # An evaluation directory without LDAPS (warned about at startup).
  scheme: ldap
  host: ldap.example.internal
  bindDn: cn=admin,dc=example,dc=com
  bindPassword: example-ldap-password
  userBaseDn: dc=example,dc=com
  groupBaseDns:
    - "ou=Groups,dc=example,dc=com"
superUserDns:
  - "cn=Jane Admin,ou=Users,dc=example,dc=com"
smtp:
  healthCheck: false
license:
  file: |
    -----BEGIN ENS LICENSE-----
    example
    -----END ENS LICENSE-----
backup:
  enabled: true
  timeZone: America/New_York
networkPolicy:
  enabled: true
