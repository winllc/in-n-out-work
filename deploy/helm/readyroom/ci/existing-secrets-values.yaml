# Every secret from Secrets you manage; mTLS with a LoadBalancer Service for the Windows client;
# air-gapped registry mirror.
global:
  imageRegistry: registry.example.internal:5000
imagePullSecrets:
  - name: mirror-pull
database:
  host: postgres.example.internal
  existingSecret: readyroom-secrets
  existingSecretKey: db-password
  # The schema owner Flyway migrates as; readyroom itself only reads and writes rows.
  migration:
    username: readyroom_owner
    existingSecret: readyroom-secrets
    existingSecretKey: migration-password
ldap:
  host: ldap.example.internal
  bindDn: CN=readyroom-svc,OU=Service Accounts,DC=example,DC=com
  existingSecret: readyroom-secrets
  existingSecretKey: ldap-password
  userBaseDn: DC=example,DC=com
  groupBaseDns:
    - "OU=Groups,DC=example,DC=com"
superUserDns:
  - "CN=Jane Admin,OU=Users,DC=example,DC=com"
smtp:
  host: smtp.example.internal
  username: readyroom
  existingSecret: readyroom-secrets
  existingSecretKey: smtp-password
tls:
  enabled: true
  keystore:
    secretName: readyroom-tls
    existingSecret: readyroom-secrets
    existingSecretKey: keystore-password
  truststore:
    secretName: readyroom-tls
    existingSecret: readyroom-secrets
    existingSecretKey: truststore-password
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
license:
  existingSecret: readyroom-license
persistence:
  license:
    existingClaim: readyroom-license
backup:
  enabled: true
  retentionDays: 30
  persistence:
    existingClaim: readyroom-backups
audit:
  file:
    enabled: true
    persistence:
      enabled: true
  splunk:
    url: https://splunk.example.internal:8088
    existingSecret: readyroom-secrets
    existingSecretKey: splunk-token
