# The whole stack: PostgreSQL, OpenLDAP, and the application built from source.
#
#     docker compose up --build
#
# The app needs an ENS license: save one as ./license/license.lic before "up" (license-init copies it
# into the ens-license volume), or sign in as an administrator and upload it at /app/admin/license.
# Without one only sign-in and that license screen work.
#
# The application's packaged defaults already name these services - postgres and
# openldap - so nothing has to be overridden for the app to find them. To run the
# app outside a container against these same services, use the local profile,
# which swaps those names for localhost and the published ports:
#
#     docker compose up -d postgres openldap
#     ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Note: this uses the same container names as test/docker-compose.yml, which
# brings up the backing services alone, so do not run both at once.

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "WINLLC"
      LDAP_DOMAIN: "winllc.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonlypass"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
      LDAP_ENABLE_PPOLICY: "true"
    ports:
      - "1389:389"
      - "1636:636"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./test/openldap/enable-pagination.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/enable-pagination.ldif
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=winllc,dc=com -s base -D cn=admin,dc=winllc,dc=com -w adminpassword >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  # Copies ./license/license.lic, when there is one, into the ens-license volume the app keeps its
  # license and licensing state in (installation id, revisions), and hands that directory to the app's
  # user. Only when the file here is newer than the one in the volume, so a license uploaded on the
  # license screen is not overwritten by an older file. Runs and exits before the app starts; reuses
  # the postgres image, so nothing else is pulled.
  license-init:
    image: postgres:16
    container_name: innout-license-init
    entrypoint:
      - sh
      - -c
      - |
        set -e
        dir=/var/lib/ens/readyroom
        if [ -f /license/license.lic ]; then
          cp -u /license/license.lic "$$dir/license.lic"
          echo "license/license.lic is in the ens-license volume"
        else
          echo "No license/license.lic: sign in as an administrator and upload one at /app/admin/license"
        fi
        chown -R 185:0 "$$dir" && chmod 0770 "$$dir"
        [ ! -f "$$dir/license.lic" ] || chmod 0660 "$$dir/license.lic"
    volumes:
      - ./license:/license:ro
      - ens-license:/var/lib/ens/readyroom
    restart: "no"
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: test/Dockerfile
    container_name: innout-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
      license-init:
        condition: service_completed_successfully
    environment:
      # Declared empty so this stays a mapping: compose rejects an environment: key whose every
      # entry is commented out ("services.app.environment must be a mapping"), which is what the
      # examples below would leave behind on their own.
      JAVA_OPTS: ""
      # Audit logging (README: Audit logging): passed through from the shell or a .env file beside this one.
      ENS_AUDIT_STDOUT: ${ENS_AUDIT_STDOUT:-true}
      ENS_AUDIT_FILE: ${ENS_AUDIT_FILE:-}
      ENS_AUDIT_FILE_KEEP: ${ENS_AUDIT_FILE_KEEP:-30}
      ENS_AUDIT_RETENTION_DAYS: ${ENS_AUDIT_RETENTION_DAYS:-0}
      ENS_AUDIT_SPLUNK_URL: ${ENS_AUDIT_SPLUNK_URL:-}
      ENS_AUDIT_SPLUNK_TOKEN: ${ENS_AUDIT_SPLUNK_TOKEN:-}
      ENS_AUDIT_SPLUNK_TOKEN_FILE: ${ENS_AUDIT_SPLUNK_TOKEN_FILE:-}
      ENS_AUDIT_SPLUNK_INDEX: ${ENS_AUDIT_SPLUNK_INDEX:-}
      ENS_AUDIT_SPLUNK_SOURCETYPE: ${ENS_AUDIT_SPLUNK_SOURCETYPE:-ens:audit}
      ENS_AUDIT_SPLUNK_INSECURE: ${ENS_AUDIT_SPLUNK_INSECURE:-false}
      ENS_AUDIT_SYSLOG_HOST: ${ENS_AUDIT_SYSLOG_HOST:-}
      ENS_AUDIT_SYSLOG_PORT: ${ENS_AUDIT_SYSLOG_PORT:-}
      ENS_AUDIT_SYSLOG_PROTOCOL: ${ENS_AUDIT_SYSLOG_PROTOCOL:-tcp}
      ENS_AUDIT_SYSLOG_FACILITY: ${ENS_AUDIT_SYSLOG_FACILITY:-local0}
      # The app now defaults to the compose service names, so the mounted config is not needed to
      # reach postgres and openldap. Uncomment to layer test/application.yml over the packaged
      # config again - it also carries the seeded fixture's attribute mappings and cron intervals.
      #SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
      # Read-only demo mode: no sign-in, everything shown as the seeded Demo Admin. Off here.
      # Run test/seed-mock-data.sh first, so the account it is presented as exists. Read the Demo
      # mode section of the README before exposing an instance with this on.
      # SPRING_PROFILES_ACTIVE: demo
      # Windows sign-in for the check-in calls (see the README). Needs an AD domain, so it is off here.
      # APPLICATION_WINDOWSAUTH_ENABLED: "true"
      # APPLICATION_WINDOWSAUTH_SERVICEPRINCIPAL: HTTP/inout.winllc.com@WINLLC.COM
      # APPLICATION_WINDOWSAUTH_KEYTABLOCATION: /etc/in-n-out/http.keytab
    volumes:
      - ./test/application.yml:/app/config/application.yml:ro
      # The ENS Solutions license and licensing state (ENS_LICENSE_STATE_DIR in the image). Put
      # license.lic in ./license for license-init to copy in, or upload it on the license screen.
      # Without one only sign-in and the license screen work. See Licensing in the README.
      - ens-license:/var/lib/ens/readyroom
      # The audit log file, when ENS_AUDIT_FILE=/var/log/ens/readyroom/audit.jsonl.
      - ens-audit:/var/log/ens
      # - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      # - ./kerberos/http.keytab:/etc/in-n-out/http.keytab:ro
    ports:
      # Plain HTTP by default; see server.ssl in application.yml for turning TLS back on.
      - "8181:8181"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  openldap_data:
  openldap_config:
  ens-license:
  ens-audit:
